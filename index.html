  const strip=o=>{const {id:_x,updatedAt:_u,...r}=o||{};return r;};const same=(a,b)=>KSync.hash(strip(a))===KSync.hash(strip(b));   // 지금과 같은 문서는 다시 쓰지 않는다 (수정 시각만 다르면 같은 것)
  const ops=[];for(const c of DATA_COLS){const src=d[c]&&typeof d[c]==="object"?d[c]:{};for(const id in src)if(!cur[c][id]||!same(cur[c][id],src[id]))ops.push(["set",c+"/"+id,src[id]]);for(const id in cur[c])if(!(id in src))ops.push(["del",c+"/"+id]);}

function moveAcct(id,dir){const g=ownerGroups().find(x=>x.accts.some(a=>a.id===id));if(!g)return;
  const i=g.accts.findIndex(a=>a.id===id),j=i+dir;if(j<0||j>=g.accts.length)return;
  const all=acctList().slice();const ai=all.indexOf(g.accts[i]),aj=all.indexOf(g.accts[j]);[all[ai],all[aj]]=[all[aj],all[ai]];
  applyOrder("accounts",all,S.accounts);}
function moveHold(id,dir){const h=S.holdings[id];if(!h)return;const list=acctHoldings(h.accountId).slice();
  const i=list.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];
  applyOrder("holdings",list,S.holdings);}
function moveAsset(t,dir){const list=watchList();const i=list.findIndex(x=>x.ticker===t),j=i+dir;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];
  const changed=list.map((x,k)=>[x,k]).filter(([x,k])=>x.order!==k);
  const had=new Set(changed.filter(([x])=>S.assets[x.ticker]).map(([x])=>x.ticker));
  changed.forEach(([x,k])=>{S.assets[x.ticker]={...(S.assets[x.ticker]||{ticker:x.ticker,name:x.name,currency:x.currency,assetClass:x.assetClass,riskyDefault:x.riskyDefault??null}),order:k};S.ordPend.assets[x.ticker]=k;});hydrate();render();
  // 이미 있는 관심 종목은 순서만 고친다 (다른 곳에서 바뀐 이름 등을 옛 값으로 덮지 않게)
  orderQ=orderQ.then(async()=>{const ok=await write(async db=>{for(const [x,k] of changed){if(had.has(x.ticker))await db.doc("assets/"+x.ticker).update({order:k});else{const {id,saved,held,...doc}=S.assets[x.ticker];await db.doc("assets/"+x.ticker).set({...doc,order:k});}}});
    if(!ok)changed.forEach(([x])=>delete S.ordPend.assets[x.ticker]);});}
let orderQ=Promise.resolve();
function applyOrder(col,list,store){
  const changed=list.map((x,i)=>[x.id,i]).filter(([id,i])=>store[id]&&store[id].order!==i);
  changed.forEach(([id,i])=>{store[id]={...store[id],order:i};S.ordPend[col][id]=i;if(col==="holdings"&&S.holdingsRaw[id])S.holdingsRaw[id]={...S.holdingsRaw[id],order:i};});render();
  orderQ=orderQ.then(async()=>{const ok=await write(async db=>{for(const [id,i] of changed)await db.doc(col+"/"+id).update({order:i});});if(!ok)changed.forEach(([id])=>delete S.ordPend[col][id]);});}

// 이체 한 줄: 월 단위는 '월 금액 × 개월', 연 단위는 '연 1회 · N월'
function trRow(lab, x, mm, kn) { return x.freq === "year" ? kn(`${lab} <span class="meta">연 1회 · ${x.month}월</span>`, x.amount) : mm(lab, x.amount); }
// 그 구성원과 관련된 이벤트만 (계좌 개설·해지, 퇴직금, 목돈 지출, 계획 끝, 내는 사람이면 주택·대출)
function memberEvents(r, mid, k) { return (r.events || []).map((e, i) => [e, i]).filter(([, i]) => ((r.eventWho || [])[i] || []).includes(mid)).map(([e, i]) => k == null ? e : evText(r, i, k)); }

function wdRow(sim, r, mid, who = "") { const w = wdStats(sim, r, mid); const t = pctTxt(w.rate); if (!(w.draw > 1) || !(w.base > 0) || t === "–") return "";
  return kv(`인출률 <span class="meta">계좌 인출 ${eok(w.draw)} ÷ 연초 ${who}금융자산 ${eok(w.base)}${S.real ? " (명목)" : ""}</span>`, t); }

// 구성원 삭제: 그 사람 명의 장부 계좌가 있으면 막고, 계획 항목(수입·지출·목돈·이체·개설 예정 계좌)은 함께 지운다
function delMember(bg, m) {
  const p = PL(); const id = m.id;

  if (own.length) { sheetErr(bg, `${m.name} 명의 계좌가 ${own.length}개 있습니다 (${own.slice(0, 3).map(a => a.name).join(", ")}${own.length > 3 ? " 등" : ""}). 계좌 수정에서 명의자를 먼저 바꾸세요.`); return false; }
  const fut = new Set(p.futureAccounts.filter(f => ((p.accountPlans || {})[f.id] || {}).ownerId === id).map(f => f.id));
  const n = { 수입: p.incomes.filter(i => i.ownerId === id).length, 지출: p.expenses.filter(e => e.memberId === id).length, 목돈: p.events.filter(e => e.memberId === id).length,
    이체: p.transfers.filter(t => t.fromId === id || t.toId === id).length, "개설 예정 계좌": fut.size };
  p.members = p.members.filter(x => x.id !== id); p.incomes = p.incomes.filter(i => i.ownerId !== id); p.expenses = p.expenses.filter(e => e.memberId !== id);
  p.events = p.events.filter(e => e.memberId !== id); p.transfers = p.transfers.filter(t => t.fromId !== id && t.toId !== id);
  if (fut.size) { p.futureAccounts = p.futureAccounts.filter(f => !fut.has(f.id)); fut.forEach(f => delete p.accountPlans[f]); p.surplusOrder = (p.surplusOrder || []).filter(x => !fut.has(x)); p.drawOrder = (p.drawOrder || []).filter(x => !fut.has(x)); }

  savePlan("삭제했습니다" + (parts.length ? ` (함께 지운 항목: ${parts.join(", ")})` : ""));

function vSpend() {

  if (t.dataset.transfer) { transferSheet(PL().transfers.find(x => x.id === t.dataset.transfer)); return true; }
  if (t.dataset.aplan) { acctPlanSheet(t.dataset.aplan); return true; }
  if (t.dataset.ord) { moveOrder(t.dataset.ord, t.dataset.oid, num(t.dataset.dir)); return true; }
  if (t.dataset.autodraw) { const id = t.dataset.autodraw; const p = PL(); const ap = p.accountPlans[id] || (p.accountPlans[id] = {}); ap.noAutoDraw = !autoOff(id); savePlan(ap.noAutoDraw ? "부족할 때 이 계좌는 꺼내지 않습니다" : "부족할 때 이 계좌도 씁니다"); return true; }
  if (t.dataset.prop) { propSheet(PL().properties.find(x => x.id === t.dataset.prop)); return true; }
  if (t.dataset.loan) { loanSheet(PL().loans.find(x => x.id === t.dataset.loan)); return true; }
  switch (t.id) {
    case "addMember": memberSheet(); return true;
    case "addEvent": eventSheet(); return true;
    case "addTransfer": transferSheet(); return true;
    case "addFuture": futureSheet(); return true;
    case "addProp": propSheet(); return true;

    case "saveAssume": saveAssume(); return true;
    case "resetAssume": PL().assumptions = {}; savePlan("기본값으로 되돌렸습니다"); return true;
  }
  return false;
}

/* ---------- 확인할 점: 계획 계산에서 나온 안내를 모아 보고, 확인하면 감춘다 ----------

const W_TAG = { deficit: "돈 모자람", contribCut: "납입 줄임", tcut: "이체 줄임", ilimit: "ISA 한도", plimit: "연금 납입 한도", isa1: "ISA 중복", xacct: "이체 받을 계좌", xfer: "연금계좌 이전", early: "55세 전 인출", overlimit: "연금수령한도 초과", pclose: "연금계좌 해지", isa3: "ISA 3년 전 해지", p1500: "사적연금 1,500만원 초과", minCash: "생활비 통장 최소 잔액", err: "계산 오류", setup: "설정" };
function warnId(w) { const t = `${w.type}|${w.key || w.msg}|${w.from}`; let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return `${w.type}.${w.from}.${(h >>> 0).toString(36)}`; }

  return [["main", sim]].concat((sim.groups || []).map(g => [g.key, g.result])).flatMap(([gk, g]) => ((g && g.warnings) || []).filter(w => w.type !== "setup").map(w => { const id = warnId(w); return { ...w, gk, id, mid: warnMember(w), acked: !!ack[id] }; })); }
function ackWarns(ids, on) { const cur = { ...((S.settings || {}).warnAck || {}) }; const t = today(); ids.forEach(id => { if (on) cur[id] = t; else delete cur[id]; });
  const ks = Object.keys(cur); if (ks.length > 300) ks.sort((a, b) => String(cur[a]).localeCompare(String(cur[b]))).slice(0, ks.length - 300).forEach(k => delete cur[k]);   // 오래된 것부터 지워 300개까지
  const q = writeSettings({ ...S.settings, warnAck: cur }); render(); return q; }
const wOrder = (a, b) => (b.type === "deficit") - (a.type === "deficit") || a.from - b.from;
function warnYears(w) { return w.from === w.to ? `${w.from}` : `${w.from}–${w.to}`; }

  svg += `<path d="${tl} L${x(t1).toFixed(1)} ${Hh - B} L${x(t0).toFixed(1)} ${Hh - B} Z" fill="var(--c1)" opacity=".14"/>`;
  const cp = list.map((s, i) => [i, s.cost]).filter(([, c]) => c > 0);   // 원금은 남긴 기록만 잇는다
  if (cp.length > 1) svg += `<path d="${cp.map(([i, c], j) => `${j ? "L" : "M"}${x(tt[i]).toFixed(1)} ${y(c).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  svg += `<path d="${tl}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round"/>`;
  // 날짜 눈금: 처음·끝과 그 사이 두세 개
  const nT = W < 500 ? 3 : 5; for (let k = 0; k < nT; k++) { const t = t0 + (t1 - t0) * k / (nT - 1); const d = new Date(t + 9 * 3600e3).toISOString().slice(2, 10).replace(/-/g, ".");
    svg += `<text x="${x(t)}" y="${Hh - B + 16}" text-anchor="${k === 0 ? "start" : k === nT - 1 ? "end" : "middle"}" class="ax">${d}</text>`; }
  const ls = list[list.length - 1]; svg += `<circle cx="${x(t1)}" cy="${y(ls.total)}" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`;
  svg += `<line id="trx" x1="0" x2="0" y1="${T}" y2="${Hh - B}" stroke="var(--ink)" stroke-width="1" opacity="0"/><circle id="trd" r="4.5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2" opacity="0"/><rect id="trhit" x="${L}" y="${T}" width="${W - L - R}" height="${Hh - T - B}" fill="transparent" style="touch-action:pan-y"/></svg>`;
  wrap.querySelectorAll("svg").forEach(s => s.remove()); wrap.insertAdjacentHTML("afterbegin", svg);
  const hit = wrap.querySelector("#trhit"), xh = wrap.querySelector("#trx"), dot = wrap.querySelector("#trd"), tip = document.getElementById("trendTip");
  const show = ev => { const r = hit.getBoundingClientRect(); const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left + L;
    let bi = 0, bd = Infinity; tt.forEach((t, i) => { const d = Math.abs(x(t) - px); if (d < bd) { bd = d; bi = i; } });
    const s = list[bi], X = x(tt[bi]); xh.setAttribute("x1", X); xh.setAttribute("x2", X); xh.setAttribute("opacity", ".35"); dot.setAttribute("cx", X); dot.setAttribute("cy", y(s.total)); dot.setAttribute("opacity", "1");
    tip.innerHTML = `<b>${esc(s.date)}</b><span class="tr"><i style="background:var(--c1)"></i>평가액<b>${sh(s.total)}</b></span>${s.cost ? `<span class="tr"><i class="dash" style="border-top:2px dashed var(--c2);height:0;width:10px;border-radius:0;background:none"></i>원금<b>${sh(s.cost)}</b></span><span class="tr tot">평가손익<b class="${cls(s.total - s.cost)}">${s.total - s.cost > 0 ? "+" : ""}${sh(s.total - s.cost)}${trPlR(s) != null ? ` (${trPct(s, 1)})` : ""}</b></span>` : ""}`;
    tip.hidden = false; const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(0, X - tw / 2), W - tw) + "px"; tip.style.top = "0px"; };
  const hide = () => { tip.hidden = true; xh.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); };
  hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show); hit.addEventListener("pointerleave", hide);
}
function trendClick(t) {
  if (t.dataset.trr) { S.trRange = t.dataset.trr; S.trMore = 0; try { localStorage.setItem("rf.trr", S.trRange); } catch (e) {} render(); return true; }
  if (t.dataset.trm) { S.trMem = t.dataset.trm; S.trMore = 0; try { localStorage.setItem("rf.trm", S.trMem); } catch (e) {} render(); return true; }
  if (t.dataset.trg) { S.trGran = t.dataset.trg; S.trMore = 0; try { localStorage.setItem("rf.trg", S.trGran); } catch (e) {} render(); return true; }
  if (t.id === "trMore") { S.trMore++; render(); return true; }
  if (t.id === "snapNow") { if (!acctList().length || !(totals().total > 0)) toast("기록할 평가액이 없습니다. 계좌와 보유 종목을 먼저 넣으세요."); else recordSnap(false); return true; }
  return false;
}
