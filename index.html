<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kinfolio</title>
<meta name="description" content="가족 은퇴자금 장부와 계획">
<meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script>// Kinfolio 앱(PWA) 실행 환경: 아티팩트의 window.claude 대신
//  - db: 이 기기의 IndexedDB에 저장하는 문서 저장소 (아티팩트 저장소와 같은 모양)
//  - mcp: 구글 드라이브 API를 직접 부르는 어댑터 (claude.ai Google Drive 커넥터와 같은 도구 이름·결과 모양)
//  - downloads: 파일 저장
// 구글 로그인은 Google Identity Services(토큰 방식)로 하고, 토큰은 이 기기에 한 시간 동안만 둔다.
(function () {
  "use strict";
  const CFG = window.KINFOLIO_CONFIG || {};
  const SCOPE = "https://www.googleapis.com/auth/drive";
  const API = "https://www.googleapis.com/drive/v3";
  const UP = "https://www.googleapis.com/upload/drive/v3";
  const FIELDS = "id,name,mimeType,parents,createdTime,modifiedTime,size,webViewLink";
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} } };

  /* ---------- 이 기기 저장소 (IndexedDB) ---------- */
  const IDB_NAME = "kinfolio", IDB_STORE = "kv";
  function idbOpen() {
    return new Promise((ok, no) => {
      let r; try { r = indexedDB.open(IDB_NAME, 1); } catch (e) { no(e); return; }
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
      r.onsuccess = () => { const d = r.result; d.onversionchange = () => d.close(); ok(d); }; r.onerror = () => no(r.error);
    });
  }
  let idb = null;
  // 문서마다 따로 저장한다 (키 "d:" + 경로). 쓰기는 바로, 저장이 끝날 때까지 기다린다 (앱이 곧 닫혀도 잃지 않게)
  const K = p => "d:" + p;
  const tx = (mode, fn) => new Promise((ok, no) => { const t = idb.transaction(IDB_STORE, mode); const r = fn(t.objectStore(IDB_STORE)); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); t.onabort = () => no(t.error || new Error("abort")); });
  function readAll() {
    return new Promise((ok, no) => { const t = idb.transaction(IDB_STORE, "readonly"); const st = t.objectStore(IDB_STORE); const out = {}; let legacy = null;
      const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (!cur) return; const k = String(cur.key); if (k.startsWith("d:")) out[k.slice(2)] = cur.value; else if (k === "docs") legacy = cur.value; cur.continue(); };
      t.oncomplete = () => ok({ docs: out, legacy }); t.onerror = () => no(t.error); });
  }
  let docs = {};                 // "col/id" → 문서
  const colL = {}, docL = {};    // 구독
  let seq = 0, pendingW = 0;
  function storageFail(e) { console.warn("이 기기 저장 실패", e); if (!PWA.storageError) { PWA.storageError = "write"; changed(); } }
  // 이 기기 저장소에 쓴다. 다른 창에서 받은 변경(fromOther)은 그 창이 이미 썼으므로 쓰지 않는다
  function persist(p, v) {
    if (!idb) return Promise.reject(new Error("no-idb"));
    pendingW++;
    return tx("readwrite", st => v === undefined ? st.delete(K(p)) : st.put(v, K(p))).then(() => { pendingW--; }, e => { pendingW--; storageFail(e); throw { code: "storage_error", message: "이 기기에 저장하지 못했습니다" }; });
  }
  const colOf = p => p.slice(0, p.lastIndexOf("/"));
  function colSnap(col, q) {
    let list = Object.keys(docs).filter(p => colOf(p) === col).map(p => ({ id: p.slice(col.length + 1), d: docs[p] }));
    const OPS = { "==": (a, b) => a === b, "!=": (a, b) => a !== b, "<": (a, b) => a < b, "<=": (a, b) => a <= b, ">": (a, b) => a > b, ">=": (a, b) => a >= b };
    for (const [f, op, v] of (q && q.where) || []) { const t = OPS[op]; if (t) list = list.filter(x => x.d[f] !== undefined && t(x.d[f], v)); }
    if (q && q.order) { const [f, dir] = q.order; list.sort((a, b) => { const x = a.d[f], y = b.d[f]; const c = x < y ? -1 : x > y ? 1 : 0; return dir === "desc" ? -c : c; }); }
    if (q && q.limit) list = list.slice(0, q.limit);
    return { size: list.length, empty: !list.length, docs: list.map(x => ({ id: x.id, exists: true, data: () => clone(x.d) })) };
  }
  const docSnap = p => ({ id: p.slice(p.lastIndexOf("/") + 1), exists: p in docs, data: () => clone(docs[p]) });
  const dirtyC = new Set(), dirtyD = new Set(); let flushT = null;
  function notify(p) {
    dirtyC.add(colOf(p)); dirtyD.add(p);
    if (!flushT) flushT = setTimeout(() => { flushT = null; const cs = [...dirtyC], ds = [...dirtyD]; dirtyC.clear(); dirtyD.clear();
      cs.forEach(c => (colL[c] || []).forEach(l => l.fn(colSnap(c, l.q)))); ds.forEach(d => (docL[d] || []).forEach(fn => fn(docSnap(d)))); }, 0);
  }
  function query(col, q) {
    return {
      orderBy: (f, dir) => query(col, { ...q, order: [f, dir || "asc"] }),
      limit: n => query(col, { ...q, limit: n }),
      where: (f, op, v) => query(col, { ...q, where: [...((q && q.where) || []), [f, op, v]] }),
      onSnapshot(fn) { const l = { fn, q }; (colL[col] = colL[col] || []).push(l); setTimeout(() => fn(colSnap(col, q)), 0); return () => { colL[col] = (colL[col] || []).filter(x => x !== l); }; },
      get: async () => colSnap(col, q)
    };
  }
  let bc = null; try { bc = new BroadcastChannel("kinfolio-db"); } catch (e) { bc = null; }
  const tell = (p, v) => { if (bc) try { bc.postMessage({ p, v: v === undefined ? null : v, del: v === undefined }); } catch (e) {} };
  function setMem(p, v) { if (v === undefined) { if (!(p in docs)) return false; const n = { ...docs }; delete n[p]; docs = n; } else docs = { ...docs, [p]: v }; notify(p); return true; }
  function put(p, v, fromOther) {
    const had = p in docs, prev = docs[p];
    if (!setMem(p, v)) return Promise.resolve(); if (fromOther) return Promise.resolve();
    seq++; if (!idb) { tell(p, v); return Promise.resolve(); }   // 저장소를 못 열었으면 메모리에만 (배너로 알림)
    return persist(p, v).then(() => tell(p, v), e => {
      if (docs[p] === v) setMem(p, had ? prev : undefined);   // 저장하지 못한 변경은 화면에서도 되돌린다 (그사이 더 새로 쓴 것이 없을 때)
      throw e; });   // 다른 창에는 저장이 끝난 뒤 알린다 (그 창이 저장소를 다시 읽어도 같은 값)
  }
  // 다른 창·다른 실행이 이 기기 저장소를 바꿨을 수 있으면 다시 읽어 맞춘다 (BroadcastChannel이 없거나 앱이 멈춰 있던 동안)
  async function reconcile() {
    if (!idb || pendingW || PWA.storageError) return;
    const s0 = seq; let got; try { got = (await readAll()).docs; } catch (e) { return; }
    if (seq !== s0 || pendingW) return;   // 읽는 사이 이 창에서 썼으면 다음에
    const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    for (const p in got) if (!eq(got[p], docs[p])) put(p, clone(got[p]), true);
    for (const p of Object.keys(docs)) if (!(p in got)) put(p, undefined, true);
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") dbReady.then(reconcile); });
  if (bc) bc.onmessage = e => { const m = e.data || {}; if (typeof m.p !== "string") return; dbReady.then(() => put(m.p, m.del ? undefined : clone(m.v), true)); };
  const LocalDB = Object.freeze({
    collection: col => query(col, {}),
    doc: p => ({
      onSnapshot(fn) { (docL[p] = docL[p] || []).push(fn); setTimeout(() => fn(docSnap(p)), 0); return () => { docL[p] = (docL[p] || []).filter(x => x !== fn); }; },
      get: async () => docSnap(p),
      set: async v => put(p, clone(v)),
      update: async v => { if (!(p in docs)) return; return put(p, { ...docs[p], ...clone(v) }); },   // 없는 문서는 만들지 않는다 (지운 문서에 순서만 남는 일이 없게)
      delete: async () => put(p, undefined)
    })
  });
  const dbReady = (async () => {
    try {
      idb = await idbOpen(); const r = await readAll(); docs = r.docs;
      // 예전 형식(모든 문서를 "docs" 한 키에)에서 옮긴다. 새 형식에 없는 문서만 가져오고 예전 키는 지운다
      if (r.legacy && typeof r.legacy === "object") { const add = Object.keys(r.legacy).filter(p => !(p in docs)); for (const p of add) docs[p] = r.legacy[p];
        await tx("readwrite", st => { for (const p of add) st.put(r.legacy[p], K(p)); st.delete("docs"); }); }
    }
    catch (e) { console.warn("IndexedDB를 쓸 수 없어 이번에만 메모리에 둡니다", e); idb = null; PWA.storageError = "open"; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    setTimeout(reconcile, 1500);
    return LocalDB;
  })();

  /* ---------- 파일 저장 ---------- */
  const MIME = { json: "application/json", csv: "text/csv", txt: "text/plain", md: "text/markdown", html: "text/html" };
  const Downloads = Object.freeze({
    save: async ({ filename, data }) => {
      const ext = String(filename || "").split(".").pop().toLowerCase();
      const blob = data instanceof Blob ? data : new Blob([data], { type: (MIME[ext] || "application/octet-stream") + ";charset=utf-8" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename || "download"; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      return { status: "saved" };
    }
  });

  /* ---------- 구글 로그인 (토큰) ---------- */
  const listeners = [];
  const changed = () => listeners.forEach(f => { try { f(); } catch (e) {} });
  let tok = null; try { tok = JSON.parse(ls.get("kf.tok") || "null"); } catch (e) { tok = null; }
  // 다른 창(탭)이 받은 토큰이 더 늦게 끝나면 그것을 쓴다
  function adoptTok() { try { const t = JSON.parse(ls.get("kf.tok") || "null"); if (t && t.t && t.exp > ((tok && tok.exp) || 0)) tok = t; } catch (e) {} }
  const tokValid = () => { if (!(tok && tok.t && tok.exp > Date.now() + 60e3)) adoptTok(); return !!(tok && tok.t && tok.exp > Date.now() + 60e3); };
  window.addEventListener("storage", e => { if (e.key === "kf.tok") { adoptTok(); changed(); } });
  const clientId = () => String(CFG.googleClientId || ls.get("kf.cid") || "").trim() || null;
  let gisP = null;
  function loadGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    return gisP || (gisP = new Promise((ok, no) => {
      const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
      s.onload = () => ok(); s.onerror = () => { gisP = null; no({ code: "server_unavailable", message: "Google 로그인을 불러오지 못했습니다" }); };
      document.head.appendChild(s);
    }));
  }
  let tc = null, tcId = null, pending = null;
  async function requestToken() {
    const id = clientId(); if (!id) throw { code: "not_configured", message: "클라이언트 ID 없음" };
    await loadGis();
    if (!tc || tcId !== id) {
      tcId = id;
      tc = google.accounts.oauth2.initTokenClient({
        client_id: id, scope: SCOPE,
        callback: r => { const p = pending; pending = null; if (!p) return;
          if (!r || r.error) { p.no({ code: r && r.error === "access_denied" ? "not_granted" : "declined", message: r && (r.error_description || r.error) }); return; }
          if (google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(r, SCOPE)) { p.no({ code: "not_granted", message: "드라이브 권한 없음" }); return; }
          tok = { t: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000 }; ls.set("kf.tok", JSON.stringify(tok)); changed(); p.ok(tok.t); },
        error_callback: e => { const p = pending; pending = null; if (p) p.no({ code: e && e.type === "popup_failed_to_open" ? "popup_blocked" : "declined", message: e && e.type }); }
      });
    }
    if (pending) return pending.p;   // 이미 로그인 창을 띄웠으면 그 결과를 같이 기다린다 (먼저 요청한 쪽을 취소하지 않게)
    let ok, no; const p = new Promise((a, b) => { ok = a; no = b; });
    const cur = pending = { ok: v => { clearTimeout(cur.to); ok(v); }, no: e => { clearTimeout(cur.to); no(e); }, p };
    cur.to = setTimeout(() => { if (pending === cur) { pending = null; no({ code: "declined", message: "응답 없음" }); } }, 180e3);
    tc.requestAccessToken({ prompt: "" }); return p;
  }
  async function token() {
    if (tokValid()) return tok.t;
    if (PWA.quiet) throw { code: "needs_reauth", message: "연결이 끊겼습니다" };
    return requestToken();
  }
  // 내 토큰만 지운다 (다른 창이 그사이 받은 새 토큰은 남긴다)
  function dropToken() { const mine = tok && tok.t; tok = null; try { const t = JSON.parse(ls.get("kf.tok") || "null"); if (!t || !mine || t.t === mine) ls.set("kf.tok", null); } catch (e) { ls.set("kf.tok", null); } changed(); }

  /* ---------- 구글 드라이브 API → 커넥터와 같은 도구 ---------- */
  async function api(method, url, { body, headers, raw } = {}) {
    let t = await token(), res;
    const go = () => fetch(url, { method, headers: { Authorization: "Bearer " + t, ...(headers || {}) }, body });
    try { res = await go(); } catch (e) { throw { code: "server_unavailable", message: "네트워크 오류" }; }
    if (res.status === 401) { dropToken(); if (tokValid()) t = tok.t; else { if (PWA.quiet) throw { code: "needs_reauth", message: "연결이 끊겼습니다" }; t = await requestToken(); } try { res = await go(); } catch (e) { throw { code: "server_unavailable", message: "네트워크 오류" }; } }
    if (!res.ok) {
      let msg = "", reason = ""; try { const j = await res.json(); msg = (j.error && j.error.message) || ""; reason = (j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || (j.error && j.error.status) || ""; } catch (e) {}
      if (res.status === 401) { dropToken(); throw { code: "needs_reauth", message: msg }; }
      if (res.status === 429 || /rateLimit/i.test(reason)) throw { code: "rate_limited", message: msg, retryable: true };
      if (res.status === 403 && /insufficient|scope|PERMISSION/i.test(reason + msg)) throw { code: "not_granted", message: msg };
      if (res.status >= 500) throw { code: "server_unavailable", message: msg, retryable: true };
      throw { code: "tool_error", message: msg || ("HTTP " + res.status) };
    }
    if (raw) return res;
    if (res.status === 204) return {};
    const txt = await res.text(); return txt ? JSON.parse(txt) : {};
  }
  const pub = f => ({ id: f.id, title: f.name, mimeType: f.mimeType, parentId: (f.parents || [])[0], createdTime: f.createdTime, modifiedTime: f.modifiedTime, fileSize: f.size, viewUrl: f.webViewLink });
  function b64(buf) { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  function multipart(meta, text, type) {
    const bd = "kinfolio" + Math.random().toString(36).slice(2);
    const body = new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`, JSON.stringify(meta), `\r\n--${bd}\r\nContent-Type: ${type || "application/octet-stream"}; charset=UTF-8\r\n\r\n`, text, `\r\n--${bd}--`]);
    return { body, headers: { "Content-Type": "multipart/related; boundary=" + bd } };
  }
  // 커넥터 검색 문법(title, parentId, mimeType) → 드라이브 API q
  function toQ(q) {
    return String(q || "").replace(/parentId\s*=\s*'([^']*)'/g, "'$1' in parents").replace(/\btitle\b(\s*(=|!=|contains)\s*')/g, "name$1") + (q ? " and " : "") + "trashed = false";
  }
  const tools = {
    async create_file(i) {
      const meta = { name: i.title }; if (i.parentId) meta.parents = [i.parentId];
      if (i.contentMimeType === "application/vnd.google-apps.folder" && i.textContent == null) {
        meta.mimeType = i.contentMimeType;
        return pub(await api("POST", `${API}/files?fields=${FIELDS}`, { body: JSON.stringify(meta), headers: { "Content-Type": "application/json" } }));
      }
      const conv = { "text/csv": "application/vnd.google-apps.spreadsheet" }[i.contentMimeType];
      meta.mimeType = conv && !i.disableConversionToGoogleType ? conv : (i.contentMimeType || "text/plain");
      const m = multipart(meta, i.textContent || "", i.contentMimeType);
      return pub(await api("POST", `${UP}/files?uploadType=multipart&fields=${FIELDS}`, m));
    },
    async download_file_content(i) {
      const id = encodeURIComponent(i.fileId);
      // 시세 시트처럼 내보낼 형식을 주면 바로 export, 아니면 파일 내용 그대로 (메타데이터를 먼저 묻지 않아 요청이 한 번)
      if (i.exportMimeType) { const res = await api("GET", `${API}/files/${id}/export?mimeType=${encodeURIComponent(i.exportMimeType)}`, { raw: true }); return { content: b64(await res.arrayBuffer()), id: i.fileId, mimeType: i.exportMimeType }; }
      let res;
      try { res = await api("GET", `${API}/files/${id}?alt=media`, { raw: true }); }
      catch (e) { if (e && e.code === "tool_error") { res = await api("GET", `${API}/files/${id}/export?mimeType=text%2Fplain`, { raw: true }); } else throw e; }   // 구글 문서 형식이면 글자로 내보낸다
      return { content: b64(await res.arrayBuffer()), id: i.fileId, mimeType: res.headers.get("content-type") || "" };
    },
    async search_files(i) {
      const u = `${API}/files?q=${encodeURIComponent(toQ(i.query))}&fields=${encodeURIComponent("nextPageToken,files(" + FIELDS + ")")}&pageSize=${Math.min(Number(i.pageSize) || 30, 100)}&orderBy=${encodeURIComponent("modifiedTime desc")}&spaces=drive` + (i.pageToken ? "&pageToken=" + encodeURIComponent(i.pageToken) : "");
      const r = await api("GET", u); return { files: (r.files || []).map(pub), nextPageToken: r.nextPageToken };
    },
    async trash_file(i) { await api("PATCH", `${API}/files/${encodeURIComponent(i.fileId)}`, { body: JSON.stringify({ trashed: true }), headers: { "Content-Type": "application/json" } }); return {}; },
    // 커넥터와 달리 내용도 바꿀 수 있다 (동기화 파일을 제자리에서 고친다)
    async update_file(i) {
      let f = null;
      if (i.textContent != null) f = await api("PATCH", `${UP}/files/${encodeURIComponent(i.fileId)}?uploadType=media&fields=${FIELDS}`, { body: new Blob([i.textContent]), headers: { "Content-Type": (i.contentMimeType || "application/json") + "; charset=UTF-8" } });
      if (i.title || i.parentId) f = await api("PATCH", `${API}/files/${encodeURIComponent(i.fileId)}?fields=${FIELDS}`, { body: JSON.stringify(i.title ? { name: i.title } : {}), headers: { "Content-Type": "application/json" } });
      return f ? pub(f) : {};
    }
  };
  const DriveMcp = Object.freeze({
    callTool: async (server, tool, input) => {
      if (server !== "Google Drive") throw { code: "not_in_manifest", message: server };
      if (!tools[tool]) throw { code: "not_in_manifest", message: tool };
      return { payload: await tools[tool](input || {}) };
    }
  });

  /* ---------- 앱에 드러내는 것 ---------- */
  const PWA = window.KinfolioPWA = {
    quiet: false,   // true면 로그인 창을 띄우지 않는다(자동 동기화)
    storageError: null,   // "open": 저장소를 못 열어 메모리에만 / "write": 저장 실패
    clientId,
    setClientId(id) { ls.set("kf.cid", String(id || "").trim() || null); tc = null; dropToken(); },
    hasToken: tokValid,
    connect: () => requestToken(),

<script>// 기기 간 동기화: 구글 드라이브의 데이터 파일(‘Kinfolio 데이터.json’)과 이 기기 저장소를 3-way로 맞춘다.
// 문서마다 "지난 동기화 때 내용(B)"과 비교해 어느 쪽이 바뀌었는지 보고, 한쪽만 바뀌었으면 그쪽을, 양쪽 다 바뀌었으면 updatedAt이 새로운 쪽을 고른다.
// 지운 문서는 파일의 tombs(지운 기록)로 알린다. 기록 없이 빠진 문서는 예전 파일이 덮어쓴 것으로 보고 지우지 않는다.
const KSync = (() => {
  const COLS = ["accounts", "holdings", "prices", "assets", "snapshots"];
  const TOMB_DAYS = 180, SEEN_MAX = 100;
  // 설정·계획은 한 문서에 여러 항목이 있어, 양쪽이 고쳤으면 항목별로 합친다 (지난 동기화 내용을 기준으로)

  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  // 키 순서와 무관한 문자열 (해시용)
  function stable(v) {
    if (v === undefined) return "u";
    if (v === null || typeof v !== "object") return JSON.stringify(v);
    if (Array.isArray(v)) return "[" + v.map(x => x === undefined ? "null" : stable(x)).join(",") + "]";
    return "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
  }
  function hash(v) {
    if (v === undefined) return "";
    const s = stable(v); let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(36) + "." + (h1 >>> 0).toString(36) + "." + s.length.toString(36);
  }
  // 내보내기 형식의 data → {"accounts/a1": 문서, …, "settings/main": 설정, "plan/main": 계획}
  function flatten(data) {
    const o = {}; if (!data || typeof data !== "object") return o;
    for (const c of COLS) { const m = data[c]; if (m && typeof m === "object") for (const id in m) if (m[id] && typeof m[id] === "object") o[c + "/" + id] = m[id]; }
    if (data.settings && typeof data.settings === "object" && Object.keys(data.settings).length) o["settings/main"] = data.settings;
    if (data.plan && typeof data.plan === "object") o["plan/main"] = data.plan;
    return o;
  }
  function unflatten(docs) {
    const d = { accounts: {}, holdings: {}, prices: {}, assets: {}, snapshots: {}, settings: {}, plan: null };
    for (const p in docs) {
      if (p === "settings/main") { d.settings = docs[p]; continue; }
      if (p === "plan/main") { d.plan = docs[p]; continue; }
      const i = p.indexOf("/"), c = p.slice(0, i);

  function mergeArr(l, r, b, localWins, depth) {
    const m = a => new Map(a.map(x => [String(x.id), x]));

      else if (!b && lv === undefined) v = rv;          // 기준이 없으면 한쪽에만 있는 항목은 살린다
      else if (!b && rv === undefined) v = lv;

      else if (idArr(lv) && idArr(rv) && (bv === undefined || idArr(bv))) v = mergeArr(lv, rv, bv || null, localWins, depth + 1);

  // 지운 시각을 동기화 시각으로 잡으면, 지운 뒤 동기화 전에 다른 기기에서 고친 것이 ‘지운 것보다 먼저’로 보여 사라진다
  const tombTime = (opt, nowIso) => p => (opt.delAt && typeof opt.delAt[p] === "string" && opt.delAt[p] <= nowIso ? opt.delAt[p] : null) || (typeof opt.delFloor === "string" && opt.delFloor <= nowIso ? opt.delFloor : null) || nowIso;
  // L: 이 기기, R: 드라이브 파일, B: 지난 동기화 {path: [hash, updatedAt, (설정·계획은 내용)]}, T: 드라이브의 지운 기록 {path: ISO}
  // opt.preferRemote: 처음 연결한 빈 기기처럼 이 기기 내용을 믿을 수 없을 때, 양쪽이 다르면 드라이브 쪽을 고른다
  // opt.regress: 드라이브 파일이 지난번에 본 것보다 새 판이 아니면(다른 곳이 예전 파일에서 만들어 덮음) 옛날 내용을 받지 않는다
  function merge(L, R, B, T, opt = {}) {

    // 이 기기에서 지운 시각을 아는 경우만 (기록한 시각, 또는 지난 동기화 시각 = 지운 때보다 이르거나 같은 때). 모르면 null
    const tombKnown = p => (opt.delAt && typeof opt.delAt[p] === "string" && opt.delAt[p] <= nowIso ? opt.delAt[p] : null) || (typeof opt.delFloor === "string" && opt.delFloor <= nowIso ? opt.delFloor : null);

      else if (l === undefined && r !== undefined && T[p] && (!upd(r) || upd(r) <= T[p])) pick = "l";   // 지운 뒤 예전 파일이 되살린 문서 → 지운 채로

        else if (b && b[1] && !upd(r)) pick = "l";               // 드라이브 쪽이 수정 시각을 잃음(빈 계획 등) → 유지

  }

    // 옮겨 받을 계좌도 올해 해지되면, 보내는 계좌부터 처리하고 받은 돈까지 함께 옮긴다
    const pendingC = accts.filter(a => { const p = a.plan || {}; return a.open && !a.closed && !a.frozen && !isCash(a) && has(p.closeYear) && num(p.closeYear) === y; });
    const closingOrder = [];
    while (pendingC.length) { let k = pendingC.findIndex(a => !pendingC.some(b => b !== a && (b.plan || {}).closeTo === a.id)); if (k < 0) k = 0; closingOrder.push(pendingC.splice(k, 1)[0]); }
    for (const a of closingOrder) {
      const p = a.plan || {};
      const ti = tIn[a.id];
      if (ti) { a.balance += ti.amt; a.free += ti.free; a.ret += ti.ret; a.retTaxDef += ti.retTax; if (!isPension(a)) a.basis += ti.basis || 0; delete tIn[a.id]; }

        const gain = Math.max(0, bal - a.basis);

        net = bal - tax; baseTax.isa += tax; BT(a.owner).isa += tax;
      } else if (a.type === "일반(국내)" || a.type === "일반(해외)" || a.type === "기타") {
        const gain = Math.max(0, bal - a.basis);

      } else if (isPension(a) && !(dest && isPension(dest))) {

        const ret = Math.min(a.ret, bal); const free = Math.min(a.free, bal - ret);

        warn("pclose", y, `${a.name}: 연금계좌를 연금계좌가 아닌 곳으로 해지해 연금외수령으로 과세됩니다(이연퇴직소득은 퇴직소득세, 나머지는 16.5%).`);
      }
      if (dest) {
        if (!dest.open) { dest.open = true; evt(`${dest.name} 개설`, dest.owner); }
        if (isPension(dest)) {
          if (isPension(a)) addIn(dest.id, { amt: net, free: a.free, ret: a.ret, retTax: a.retTaxDef }, `${a.name} 해지 이전`);
          else {
            const isaConv = a.type === "ISA" && y - a.isaOpen >= 3;   // 만기(3년) ISA 전환금액
            const extra = isaConv ? Math.min(net * A.isaTransferCreditPct / 100, A.isaTransferCreditMax) : 0;
            addIn(dest.id, { amt: net, free: 0 }, `${a.name} 해지 이전`);   // 세액공제 받지 못한 부분은 세액공제 계산에서 비과세 원금으로 돌린다
            (P(dest.owner).penX || (P(dest.owner).penX = [])).push([dest.id, net, dest.type, extra]);
            if (!isaConv) { xferPen[dest.owner] = (xferPen[dest.owner] || 0) + net; warn("xfer", y, `${a.name}→${dest.name}: 연금계좌로 옮긴 돈은 그해 연금 납입한도(연 1,800만원)에 들어갑니다.`); }
          }
        } else {
          addIn(dest.id, { amt: net, basis: net }, `${a.name} 해지 이전`);
          if (dest.type === "ISA") { const room = isaRoom(dest); dest.isaTotal += net; isaIn[dest.id] = (isaIn[dest.id] || 0) + net;
            if (net > room + 1) warn("ilimit", y, `${byId[dest.owner].name}의 ${dest.name}: ${a.name}에서 옮겨 넣는 #AMT#이 납입 가능 한도 ${fmtW(room)}을 넘습니다 (${isaLimitTxt(dest)} − 이미 넣은 원금 ${fmtW(isaStart[dest.id] || 0)}).`, net); }
        }
        evtA(`${a.name} 해지 → ${dest.name} {A}`, net, a.owner, dest.owner);
      } else {
        bump(a.owner, net); flow.acctClose += net; BPf(a.owner).acctClose += net; evtA(`${a.name} 해지 → 현금 {A}`, net, a.owner);
      }
      closeLog[a.id] = { start: bal, tax, net, to: dest ? dest.name : "생활비 통장", why: "계획한 해지" };
      a.balance = 0; a.closed = true; B0[a.id] = 0;
    }

    function salaryActive(id, yy) {
      return salaryItems.some(i => i.ownerId === id && activeIn(id, yy) && (yy - byId[id].birthYear) >= num(i.fromAge, 0) && (yy - byId[id].birthYear) <= (has(i.toAge) ? num(i.toAge) : 200));
    }

    /* 3. 수입 */
    for (const it of incomes) {
      const o = byId[it.ownerId]; if (!o) continue;
      const age = y - o.birthYear; const alive = activeIn(o.id, y);
      const from = num(it.fromAge, 0), to = has(it.toAge) ? num(it.toAge) : 200;
      if (it.type === "salary") {
        if (alive && age >= from && age <= to) { const v = num(it.amount) * Math.pow(1 + num(it.growth) / 100, y - Y0) * PR; bump(o.id, v); flow.salary += v; P(o.id).salary += v; BPf(o.id).salary += v; }
      } else if (it.type === "npension") {
        if (age >= from) {
          const s0 = Math.max(Y0, o.birthYear + from); // 받기 시작할 때까지는 물가만큼, 그 뒤로는 연금 인상률만큼 오른다
          const idx = has(it.indexRate) ? inflF(s0) * Math.pow(1 + num(it.indexRate) / 100, y - s0) : F;
          const v = num(it.amount) * 12 * idx * PR;
          if (alive) { bump(o.id, v); flow.npension += v; P(o.id).pub += v; BPf(o.id).npension += v; }
        }

        if (alive && age === num(it.fromAge)) {

          if (dest && isPension(dest) && canReceive(dest)) {
            if (!dest.open) { dest.open = true; evt(`${dest.name} 개설`, dest.owner); }
            addIn(dest.id, { amt: v, ret: v, retTax: v * rt }, "퇴직금 입금"); evtA(`퇴직금 {A} → ${dest.name}`, v, o.id, dest.owner);
          } else { bump(o.id, v * (1 - rt)); flow.other += v * (1 - rt); BPf(o.id).other += v * (1 - rt); evt(`퇴직금 수령 (현금)`, o.id); }
        }
      } else if (it.type === "basic") {
        if (alive && age >= from && age <= to) { const s0 = Math.max(Y0, o.birthYear + from); const idx = has(it.indexRate) ? inflF(s0) * Math.pow(1 + num(it.indexRate) / 100, y - s0) : F; const v = num(it.amount) * 12 * idx * PR; bump(o.id, v); flow.basic += v; BPf(o.id).basic += v; } // 기초연금: 비과세·건보료 미반영
      } else {
        if (alive && age >= from && age <= to) { const v = num(it.amount) * (it.inflate === false ? 1 : F) * PR; bump(o.id, v); flow.other += v; BPf(o.id).other += v; }
      }
    }

    /* 4. 생활비·목돈 */
    for (const e of expenses) {
      let age, alive;
      if (e.memberId === "household" || !byId[e.memberId]) { age = primAge; alive = anyHorizonAlive(y); }
      else { age = y - byId[e.memberId].birthYear; alive = activeIn(e.memberId, y); }
      if (!alive) continue;
      if (age >= num(e.fromAge, 0) && age <= (has(e.toAge) ? num(e.toAge) : 200)) { const v = num(e.monthly) * 12 * F * PR; flow.living += v; if (byId[e.memberId]) { bump(e.memberId, -v); BPf(e.memberId).living += v; } else { bump(payer, -v); BPf(payer).shared += v; } }
    }
    for (const ev of events) {
      let age, alive;
      if (ev.memberId === "household" || !byId[ev.memberId]) { age = primAge; alive = anyHorizonAlive(y); }
      else { age = y - byId[ev.memberId].birthYear; alive = activeIn(ev.memberId, y); }

      const at = num(ev.atAge), every = num(ev.every), times = Math.max(1, num(ev.times, 1));
      const d = age - at;

      if (hit) { const v = num(ev.amount) * F; flow.lump += v; if (byId[ev.memberId]) { bump(ev.memberId, -v); BPf(ev.memberId).lump += v; } else { bump(payer, -v); BPf(payer).shared += v; } evtA(`${ev.name || "목돈 지출"} {A}`, v, byId[ev.memberId] ? ev.memberId : payer); }
    }

    /* 4-1. 가족 간 이체 (생활비 지급) */
    const intT = []; // 같은 가계 안의 이체 중 ‘모자라면 줄임’을 고른 것: 보내는 사람 돈이 바닥나면 줄인다
    const xferC = {}; // 받는 사람 계좌로 보낸 이체: 그해 그 계좌에 납입한 것으로 본다 (받는 사람 돈이 모자라도 줄이지 않는다)
    for (const t of transfers) {
      const fm = byId[t.fromId], tm = byId[t.toId]; if (!fm || !tm || fm.id === tm.id) continue;
      const fIn = inG(fm.id), tIn = inG(tm.id); if (!fIn && !tIn) continue;

      // 월 단위: 월 금액 × 12 × 올해 남은 달 비율. 연 단위: 정한 달에 한 번 (올해는 그 달이 남은 기간에 있을 때만)

      if (v <= 0) continue;

      // 받는 계좌를 골랐으면 그 계좌에 넣는다 (받는 사람 명의 계좌가 그해 열려 있을 때). 아니면 받는 사람 생활비 통장으로
      const dest = t.toAccountId ? acctById[t.toAccountId] : null;
      const toAcct = tIn && dest && !isCash(dest) && dest.owner === tm.id && dest.open && canReceive(dest) ? dest : null;
      if (t.toAccountId && tIn && !toAcct) warn("xacct", y, `${tm.name}: ‘${t.name || "생활비 지급"}’ 이체를 받을 계좌가 그해 없어서(개설 전·해지·계획 끝) 생활비 통장으로 받았습니다.`);
      if (toAcct) { xferC[toAcct.id] = (xferC[toAcct.id] || 0) + v; Object.assign(fq, { acct: toAcct.id, acctName: toAcct.name }); }

      if (fIn && tIn) { bump(fm.id, -v); bump(tm.id, v); const det = { name: t.name || "생활비 지급", from: fm.id, to: tm.id, amount: v, dir: "internal", ...fq }; tDetail.push(det); if (t.onShort === "cut") intT.push({ from: fm.id, to: tm.id, v, cut: 0, det }); /* 기본은 계획대로 계속 보낸다 */ }
      else if (fIn) { bump(fm.id, -v); flow.transfer += v; tDetail.push({ name: t.name || "생활비 지급", from: fm.id, to: tm.id, amount: v, dir: "out", ...fq }); }
      else { bump(tm.id, v); flow.transferIn += v; tDetail.push({ name: t.name || "생활비 지급", from: fm.id, to: tm.id, amount: v, dir: "in", ...fq }); }
    }

    /* 5. 부동산·대출 */
    let heldProps = [];
    for (const p of props) {
      const v = p.value0 * Math.pow(1 + p.g, y - Y0);
      const bought = !has(p.buyYear) || num(p.buyYear) <= y;
      const sold = has(p.sellYear) && num(p.sellYear) <= y;
      if (has(p.buyYear) && num(p.buyYear) === y) { bump(payer, -v); BPf(payer).shared += v; flow.housing += v; evtA(`${p.name} 매입 {A}`, v, payer); }
      if (has(p.sellYear) && num(p.sellYear) === y && bought) {
        const net = v * (1 - num(p.sellCostPct, 1) / 100);
        const dest = acctById[p.proceedsTo];
        if (canReceive(dest) && !isPension(dest)) { if (!dest.open) dest.open = true; addIn(dest.id, { amt: net, basis: net }, `${p.name} 매각 대금`); }
        else { bump(payer, net); BPf(payer).acctClose += net; flow.propSaleCash += net; }
        flow.propSale += net; evtA(`${p.name} 매각 {A}`, net, canReceive(dest) && !isPension(dest) ? dest.owner : payer);
      }
      p.cur = bought && !sold ? v : 0;
      if (p.cur > 0) heldProps.push(p);
    }
    let loanDeduct = 0;
    for (const l of loans) {
      if (!l.started && has(l.startYear) && num(l.startYear) === y) { l.started = true; l.bal = num(l.balance); bump(payer, l.bal); BPf(payer).acctClose += l.bal; flow.loanIn += l.bal; evt(`${l.name} 대출 실행`, payer); }
      if (!l.started || l.bal <= 0) { l.pay = 0; continue; }
      if (y > l.endYear) { bump(payer, -l.bal); BPf(payer).shared += l.bal; flow.loanPay += l.bal; l.bal = 0; continue; }
      const n = l.endYear - y + 1; const r = l.rate;
      const pmtY = r > 0 ? l.bal * r / (1 - Math.pow(1 + r, -n)) : l.bal / n;
      const pmt = pmtY * PR; const interest = l.bal * r * PR; l.bal = Math.max(0, l.bal - (pmt - interest));
      bump(payer, -pmt); BPf(payer).shared += pmt; flow.loanPay += pmt;
      if (l.healthDeduct) loanDeduct += l.bal;
    }

    /* 6. 계획된 납입·인출 */
    const plannedC = {}, plannedW = {};
    for (const id in xferC) plannedC[id] = xferC[id];
    for (const a of accts) {
      if (isCash(a) || !a.open || a.closed || a.frozen) continue;
      const p = a.plan || {}; const po = byId[a.planOwner];
      const age = y - po.birthYear; const ownerAlive = activeIn(a.owner, y) && activeIn(a.planOwner, y);
      for (const c of p.contribs || []) {
        if (!ownerAlive) break;
        if (y === Y0 && FR < 1) break; // 올해 납입분은 이미 현재 잔액에 들어 있다고 본다
        if (age >= num(c.fromAge, 0) && age <= (has(c.toAge) ? num(c.toAge) : 200)) {
          const v = num(c.amount) * (c.inflate ? F : 1) * PR;
          plannedC[a.id] = (plannedC[a.id] || 0) + v;
        }
      }
      let w = 0;
      for (const s of PR > 0 ? p.wds || [] : []) {
        const to = has(s.toAge) ? num(s.toAge) : po.deathAge;
        if (age < num(s.fromAge, 0) || age > (has(s.toAge) ? num(s.toAge) : 200)) continue;
        const b = B0[a.id] + (tIn[a.id] ? tIn[a.id].amt : 0);
        if (s.mode === "fixed") w += num(s.amount) * (s.inflate === false ? 1 : F) * PR;
        else if (s.mode === "even") { const endA = has(s.toAge) ? to : Math.max(to, (byId[a.owner].birthYear + byId[a.owner].deathAge) - po.birthYear); const tot = Math.max(PR, endA - age + PR); w += b * PR / tot; }
        else if (s.mode === "pct") w += b * num(s.pct) / 100 * PR;
        else if (s.mode === "all") w += b;
        else if (s.mode === "limit") {
          if (y - byId[a.owner].birthYear < 55 || !(y - a.joinYear >= 5 || a.ret > 0 || (tIn[a.id] && tIn[a.id].ret > 0))) continue;
          const k = limitYear(a, y, tIn[a.id] && tIn[a.id].ret > 0);
          if (k <= 10) w += b / (11 - k) * 1.2 * PR;
          else { const tot = Math.max(PR, (byId[a.owner].birthYear + byId[a.owner].deathAge) - y + PR); w += b * PR / tot; }
        }
      }
      if (w > 0) plannedW[a.id] = w;
    }

    // 마이너스 생활비 통장은 명의자의 현금·일반·ISA와 저율과세 연금 인출(한도 안, 1,500만원까지)로 먼저 갚는다. 모자라면 남은 빚을 넘긴다
    const cashOf = mid => { const own = accts.find(a => a.type === "생활비" && a.owner === mid && a.open && !a.closed) || accts.find(a => isCash(a) && a.owner === mid && a.open && !a.closed && a.id === cashIdFor(mid)) || accts.find(a => isCash(a) && a.owner === mid && a.open && !a.closed); return own || accts.find(a => isCash(a) && a.owner === payer) || cash; };
    const reserveOf = a => MINC > 0 && isCash(a) && activeIn(a.owner, y) && cashOf(a.owner).id === a.id ? MINC : 0; // 이 통장에 남겨 둘 최소 잔액
    // 생활비 통장이 최소 잔액보다 적으면(마이너스 포함) 그해 채운다: 명의자의 현금·일반·ISA와 저율과세 연금 인출로. 모자라면 채우지 못한 채 넘긴다
    for (const a of accts) if (isCash(a) && a.open && !a.closed && activeIn(a.owner, y)) { const need = reserveOf(a) - (B0[a.id] || 0); if (need > 1) plannedC[a.id] = need; }

    /* 7. 한 해 평가 (순수 함수) */
    const cashOwner = cash.owner;
    function evaluate(draws, contribs, od) {
      od = od || {};
      const ps = {}; for (const id in person) ps[id] = { ...person[id], privDetail: [] };
      const Q = id => ps[id] || (ps[id] = { pub: 0, priv: 0, privOut: 0, retTax: 0, fin: 0, finLump: 0, finWithheldCash: 0, foreign: 0, foreignLump: 0, salary: 0, privDetail: [] });
      const end = {}; let cashIn = 0, cashOut = 0, wdTaxCash = 0;
      const pensionContrib = {}; // owner -> {sav, irp, list}
      let drawTotal = 0, pensionDraw = 0, otherDraw = 0, contribTotal = 0;
      let divWithheld = 0; let isaWdTax = 0; const isaUse = {}; const drawn = {};
      const drawP = {}, contribP = {}, taxCashP = {}; const addM = (m, k, v) => { m[k] = (m[k] || 0) + v; };
      const tp = {}; const T = id => tp[id] || (tp[id] = { pensionLow: 0, pensionHigh: 0, outside: 0, ret: 0, comp: 0, fin: 0, finW: 0, foreign: 0, isa: 0, credit: 0, total: 0 });
      for (const a of accts) {
        if (!a.open || a.closed) { end[a.id] = null; continue; }
        if (a.frozen) { end[a.id] = { balance: a.balance, basis: a.basis, free: a.free, ret: a.ret, retTaxDef: a.retTaxDef, firstWd: a.firstWd, isaExemptUse: 0 }; continue; } // 계획이 끝난 사람의 계좌는 그대로 둔다
        const t = tIn[a.id] || { amt: 0, free: 0, ret: 0, retTax: 0, basis: 0 };
        const c = contribs[a.id] || 0;
        const inflow = t.amt + c;
        let avail = B0[a.id] + inflow;
        if (!isCash(a)) { // 연중 손실(수익률·배당세)이 나면 꺼낼 수 있는 돈도 그만큼 줄어든다: 끝 잔액이 0이 되는 인출액까지만
          const kk = (a.r - (!isPension(a) && a.type !== "ISA" ? Math.max(0, a.dy) * 0.154 : 0)) * PR;

    // 연금계좌에서 w를 꺼낼 때 과세 대상 사적연금이 되는 몫: 세금 없는 원금 → 이연퇴직소득 → 나머지 순서로 꺼낸다

    const ownerPrivDraw = own => accts.filter(b => b.owner === own && isPension(b)).reduce((s2, b) => s2 + Math.max(0, (draws[b.id] || 0) - penNonTax(b)), 0);
    // 세금이 적은 순서로 단계를 나눠 꺼낸다
    // 1: 현금·일반·ISA  2: 연금수령 요건을 채운 연금계좌 (한도 안, 사적연금 1,500만원 이하)  3: 한도 안 1,500만원 초과

    function extraCap(id, t) {

      if (t === 1) { if (isCash(a)) return 0; if (a.type === "ISA") { if (y - a.isaOpen >= 3) return 0; const bi = Math.max(1, availBase(id)); return Math.max(0, 1 - a.basis / bi) * 0.154; } const bal = Math.max(1, availBase(id)); const g = Math.max(0, 1 - a.basis / bal); return a.taxKind === "dividend" ? g * 0.154 : a.taxKind === "foreign" ? g * 0.22 : 0; }
      if (t === 2) return 0.055;
      return 0.165;
    }
    let ev = evaluate(draws, contribs);
    const memberIds = gMembers.map(m => m.id);
    for (let it = 0; it < 40; it++) {
      let progressed = false;
      for (const mid of memberIds) {
        const c = ev.cashP[mid] || 0;
        if (Math.abs(c) < 500) continue;
        const mine = id => acctById[id] && acctById[id].owner === mid;
        if (c < 0) {
          let need = -c;
          for (const id of Object.keys(surp).filter(mine).reverse()) { if (need <= 0) break; const x = Math.min(surp[id], need); if (x <= 0) continue; surp[id] -= x; contribs[id] -= x; need -= x; progressed = true; }
          // 세금이 적은 돈부터: 현금·세금 적은 일반/ISA → (계획 납입 줄임) → 저율 연금(한도 안, 1,500만원까지) → 세금 많은 일반(해외주식 차익 등)
          // → (생활비 통장 채우기·마이너스 상환 줄임) → 1,500만원 초과 연금 → 생활비 통장 최소 잔액 → 한도 초과 연금 → 55세 전 연금 → (보내는 이체 줄임)

        } else {

            }
            if (y === Y0 && FR < 1 && (isPension(a) || a.type === "ISA")) cap = 0; // 올해 한도는 이미 쓴 것으로 보고 남는 돈은 현금·일반계좌로

      }
      if (!progressed) break;
      ev = evaluate(draws, contribs);
    }
    // 그래도 모자라면 명의자의 생활비 통장(없으면 계좌 밖 현금)을 마이너스로 만든다
    const od = {}; const odP = {}; const odW = {}; let overdraft = 0;
    for (let k2 = 0; k2 < 6; k2++) {
      let changed = false;
      for (const mid of memberIds) {
        const c = ev.cashP[mid] || 0; if (Math.abs(c) < 500) continue;
        const wid = odW[mid] || (odW[mid] = cashOf(mid).id);
        if (c < 0) { od[wid] = (od[wid] || 0) - c; odP[mid] = (odP[mid] || 0) - c; }
        else {
          const x = Math.min(c, odP[mid] || 0); if (x > 0) { od[wid] -= x; odP[mid] -= x; }
          if (c - x > 1) contribs[wid] = (contribs[wid] || 0) + (c - x); // 남은 돈은 생활비 통장에 넣는다
        }
        changed = true;
      }
      if (!changed) break;
      ev = evaluate(draws, contribs, od);
    }
    // 건보료·세금 기준선 근처에서 계산이 왔다 갔다 해 남은 자투리는 생활비 통장이 그대로 받는다
    for (const mid of memberIds) {
      const c = ev.cashP[mid] || 0; if (Math.abs(c) < 1) continue;
      const w = acctById[odW[mid] || cashOf(mid).id]; const e = ev.end[w.id]; if (!e || !e.f) continue;
      e.balance += c; e.basis = e.balance;
      if (c < 0) { e.f.draw += -c; ev.drawn[w.id] = (ev.drawn[w.id] || 0) - c; ev.otherDraw -= c; odP[mid] = (odP[mid] || 0) - c; }
      else { e.f.contrib += c; contribs[w.id] = (contribs[w.id] || 0) + c; ev.contribTotal += c; }
      ev.cashP[mid] = 0;
    }
    for (const mid in odP) overdraft += odP[mid];
    const unfunded = 0;
    for (const tr of intT) if (tr.cut > 1) {
      BPf(tr.from).transferOut -= tr.cut; BPf(tr.to).transferIn -= tr.cut; tr.det.amount -= tr.cut; tr.det.cut = tr.cut;
      warn("tcut", y, `${byId[tr.from].name}: 돈이 모자라 ${byId[tr.to].name}에게 보내는 ‘${tr.det.name}’ 이체를 #AMT# 줄였습니다. 받는 사람은 모자란 만큼 자기 돈으로 씁니다.`, tr.cut);
    }

    /* 9. 확정 */
    for (const a of accts) {
      const e = ev.end[a.id]; if (!e) continue;
      a.balance = e.balance; a.basis = e.basis; a.free = e.free; a.ret = e.ret; a.retTaxDef = e.retTaxDef; a.firstWd = e.firstWd;
      a.isaExemptUsed = (a.isaExemptUsed || 0) + (e.isaExemptUse || 0);
      if (a.type === "ISA") a.isaTotal += (contribs[a.id] || 0);
    }
    for (const mid of memberIds) { const cut = Object.keys(cutC).filter(id => acctById[id].owner === mid && !isCash(acctById[id])).reduce((s2, id) => s2 + cutC[id], 0); if (cut > 5000) warn("contribCut", y, `${byId[mid].name}: 자기 명의 돈이 모자라 계획된 계좌 납입을 줄였습니다. 연금계좌를 깨서 납입하지는 않습니다. 가족 간 이체를 늘리면 계획대로 납입됩니다.`); }

      if (w.balance < MINC - 5000 && w.balance > -1) warn("minCash", y, `${byId[mid].name}: 생활비 통장이 최소 잔액 ${fmtW(MINC)}보다 #AMT# 적습니다. 남은 돈이 연금수령한도 초과·55세 전 연금(16.5%)뿐이면 그보다 최소 잔액을 먼저 씁니다.`, MINC - w.balance);
    }
    for (const mid in odP) if (odP[mid] > 5000) warn("deficit", y, `${byId[mid].name}: 자기 명의 현금과 계좌를 모두 꺼내도 지출을 다 댈 수 없어 생활비 통장이 마이너스가 됩니다. 가족 간 이체나 수령 계획을 확인하세요.`);

    for (const m of gMembers) {

  }

  function sum(o, pos) { let s = 0; for (const k in o) { const v = o[k] || 0; if (!pos || v > 0) s += v; } return s; }

  /* ---------- 요약 ---------- */
  const first = rows[0], last = rows[rows.length - 1];
  const deficitRow = rows.find(r => r.overdraft > 5000);

  } : null;

  // 경고 묶기 (같은 종류·문구 연속 연도)
  const grouped = [];
  for (const w of warnings) {
    const key = w.type + "|" + w.msg;
    const g = grouped.find(x => x.key === key && x.to === w.year - 1);
    if (g) { g.to = w.year; if (w.amt != null) g.amt = Math.max(g.amt || 0, w.amt); } else grouped.push({ key, type: w.type, from: w.year, to: w.year, msg: w.msg, amt: w.amt });
  }
  for (const g of grouped) if (g.msg.includes("#AMT#")) g.msg = g.msg.replace("#AMT#", (g.from !== g.to ? "최대 " : "") + fmtW(g.amt || 0));
  return { rows, warnings: grouped, summary, members, firstYearFraction: FR, fixedReturn: FX, minCash: MINC, groupKey: G, groupMembers: gMembers.map(m => m.id), accounts: accts.map(a => ({ id: a.id, name: a.name, type: a.type })) };
}

<script>/* Kinfolio — 자산 배분 계산

 * 2) 그 금액을 계좌에 나눠 담는다: 계좌마다 담을 수 있는 종목(규칙·사용자 선택), IRP 위험자산 70%,
 *    지금 들고 있는 자리를 되도록 유지하거나(매매 최소) 세금이 적은 계좌에 담는다(세금 우선) — 최소 비용 흐름
 * 3) 계좌별 금액을 주식 수로 바꾸고(내림), 남은 돈으로 모자란 종목을 한 주씩 더 산 뒤 나머지는 예수금

(function (root) {
"use strict";

// 목표 연도 비중 w(%)와 예상 수익률 r(%) → 지금 맞출 비중과 금액
function presentTargets(total, targets, years) {
  const n = Math.max(0, years || 0);

/* 미래 입금·배당(새 돈)까지 함께 본 '지금 맞출 금액'
 * targets: [{ key, w(%), r(%) }] — 모든 종목(목표 0%도), r은 목표 연도까지 종목이 자라는 비율
 * flows:   [{ tau: 지금부터 몇 년 뒤, amt, mode?: "target"|"fill", src?: "dep"|"div" }] — 목표 연도 전에 들어올 새 돈
 * mode "target": 들어올 때마다 그때의 '지금 맞출 비중'대로 산다 → 지금 배분은 새 돈이 없을 때와 같고, 새 돈도 목표 연도에 목표 비중
 * mode "fill":   지금 가진 종목은 목표 연도에 필요한 만큼까지 그대로 두고(덜 팔기), 모자란 종목은 새 돈으로 채운다.
 *                "fill" 새 돈은 해마다 같은 비율(rho)로 산다고 본다. cur: 지금 금액, minNow: 지금 최소 금액(잠금)
 * 돌려주는 값: now(지금 맞출 금액), rho(fill 비율), W(목표 비중), dep(새 돈 전체 평균 배분), bySrc({dep, div} 평균 배분),
 *             depFinal(목표 연도 새 돈 평가액), depTotal(새 돈 합계)

function presentTargetsFlow(total, targets, years, flows = [], mode = "target", cur = {}, minNow = {}) {
  const n = Math.max(0, years || 0);
  const keys = targets.map(t => t.key);
  const W = {}; let ws = 0; for (const t of targets) { W[t.key] = Math.max(0, t.w || 0); ws += W[t.key]; }
  for (const k of keys) W[k] = ws > 0 ? W[k] / ws : 0;
  const R = Object.fromEntries(targets.map(t => [t.key, 1 + (t.r || 0) / 100]));
  const fl = (n > 0 ? flows.filter(f => f.amt > 0 && f.tau >= 0 && f.tau < n) : []).map(f => ({ ...f, mode: f.mode || mode, src: f.src || "dep" }));
  const depTotal = fl.reduce((s, f) => s + f.amt, 0);
  const den = tau => keys.reduce((s, k) => s + W[k] / Math.pow(R[k], n - tau), 0);
  const d0 = den(0);
  const zero = () => Object.fromEntries(keys.map(k => [k, 0]));
  const now = {}; for (const k of keys) now[k] = d0 > 0 ? total * (W[k] / Math.pow(R[k], n)) / d0 : 0;
  if (!(d0 > 0)) return { now, rho: zero(), W, dep: zero(), bySrc: {}, depFinal: zero(), depTotal: 0 };
  const tgtW = tau => { const d = den(tau); return Object.fromEntries(keys.map(k => [k, (W[k] / Math.pow(R[k], n - tau)) / d])); };   // 그때 맞출 비중

  if (ff.length) {
    // 채우기: fill 새 돈을 뺀 목표 연도 총액 S를 정하면, 목표 비중이 되려면 지금 가치로 종목마다 얼마가 필요한지(need)가 정해진다.
    // (target 새 돈은 목표 연도에 정확히 목표 비중이라 비중을 흐트러뜨리지 않는다)

    // 나머지 모자란 몫은 fill 새 돈으로 채우는데, 해마다 같은 비율 ρ로 산다고 보면 ρ_k = (w_k·S − x_k·G_k) / A_k 이고
    // ρ의 합이 1이 되는 S를 이분법으로 찾는다 (그러면 목표 연도에 정확히 w)
    const alloc = S => {
      const y = {}; let used = 0;
      for (const k of keys) { const need = W[k] * S / G[k]; y[k] = Math.max(minNow[k] || 0, Math.min(cur[k] || 0, need)); used += y[k]; }
      // 고정(최소 보유)이 지금 가진 것보다 많으면 그 돈은 다른 종목을 팔아 마련한다 (합계가 총액을 넘지 않게)
      if (used > total + 1e-6) { const fx = keys.map(k => [k, y[k] - (minNow[k] || 0)]).filter(e => e[1] > 0); const fs = fx.reduce((s2, e) => s2 + e[1], 0);
        if (fs > 0) { const f = Math.min(1, (used - total) / fs); for (const [k, v] of fx) y[k] -= v * f; used -= fs * f; } }
      let L = Math.max(0, total - used);
      const gap = Object.fromEntries(keys.map(k => [k, Math.max(0, W[k] * S / G[k] - y[k])])); const gs = keys.reduce((s, k) => s + gap[k], 0);
      if (gs > 0) { const f = Math.min(1, L / gs); for (const k of keys) y[k] += gap[k] * f; L -= gs * f; }
      if (L > 1e-6) for (const k of keys) y[k] += L * W[k];

    };
    const rhoOf = (S, y) => Object.fromEntries(keys.map(k => [k, A[k] > 0 ? Math.max(0, W[k] * S - y[k] * G[k]) / A[k] : 0]));
    const fS = S => { const y = alloc(S); const r = rhoOf(S, y); return keys.reduce((s, k) => s + r[k], 0) - 1; };
    let lo = 0, hi = total / d0 + ff.reduce((s, f) => s + f.amt / den(f.tau), 0);
    for (let i = 0; i < 60 && fS(hi) < 0; i++) hi *= 2;
    for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; if (fS(mid) < 0) lo = mid; else hi = mid; }
    x = alloc(hi); const r = rhoOf(hi, x); const rs = keys.reduce((s, k) => s + r[k], 0);

  const avg = list => { const t = list.reduce((s, f) => s + f.amt, 0); const o = zero(); if (!(t > 0)) return o;

  return { now: x, rho: rho || tgtW(0), W, dep: avg(fl), bySrc, depFinal, depTotal };
}

/* 해마다 따라가 보기: 지금 금액 hold에서 시작해 종목은 r만큼 자라고, 입금(flows)은 mode에 따라 그때 맞출 비중(target) 또는 rho(fill)로 산다.

function growPath({ hold, years, targets, dy = {}, flows = [], divMode = "target", rho = {} }) {
  const n = Math.max(0, years || 0); const keys = targets.map(t => t.key);
  const W = {}; let ws = 0; for (const t of targets) { W[t.key] = Math.max(0, t.w || 0); ws += W[t.key]; } for (const k of keys) W[k] = ws > 0 ? W[k] / ws : 0;
  const R = Object.fromEntries(targets.map(t => [t.key, 1 + (t.r || 0) / 100]));
  const den = tau => keys.reduce((s, k) => s + W[k] / Math.pow(R[k], n - tau), 0);
  const split = (mode, tau) => { if (mode === "fill") return rho; const d = den(tau); return Object.fromEntries(keys.map(k => [k, d > 0 ? (W[k] / Math.pow(R[k], n - tau)) / d : 0])); };

  for (let i = 0; i < n; i++) {

    if (pool) { const d = keys.reduce((s, k) => s + V[k] * (dy[k] || 0) / 100, 0); if (d > 0) { divs.push({ tau: i + 0.5, amt: d }); add.push({ tau: i + 0.5, amt: d, mode: divMode, src: "div" }); } }
    else if (divMode === "reinvest") { const amt = {}; let t = 0; for (const k of keys) { const v = V[k] * Math.sqrt(R[k]) * (dy[k] || 0) / 100; if (v > 0) { amt[k] = v; t += v; } } if (t > 0) buys.push({ i, tau: i + 0.5, src: "div", amt }); }
    for (const k of keys) V[k] *= R[k];

      for (const k of keys) { const v = b.amt * (a[k] || 0); if (v > 0) { amt[k] = v; V[k] += v * Math.pow(R[k], i + 1 - b.tau); } }

/* 배당을 모아 새 돈으로 쓸 때: 배당은 지금 배분(x)과 새 돈으로 산 종목에서 나오므로, 배당을 어림하고 → 지금 배분을 구하고 →
 * 따라가 보며 배당을 다시 구하기를 바뀌지 않을 때까지 되풀이한다. targets의 r은 가격 상승분(예상 수익률 − 배당)
 */
function planFlows({ total, targets, years, dy = {}, deposits = [], divMode = "target", cur = {}, minNow = {} }) {
  let divs = [], pf = null;
  for (let it = 0; it < 40; it++) {
    const flows = deposits.map(f => ({ ...f, src: "dep" })).concat(divs.map(d => ({ ...d, mode: divMode, src: "div" })));
    pf = presentTargetsFlow(total, targets, years, flows, "target", cur, minNow);
    const g = growPath({ hold: pf.now, years, targets, dy, flows: deposits, divMode, rho: pf.rho });
    const diff = g.divs.reduce((s, d, i) => s + Math.abs(d.amt - ((divs[i] || {}).amt || 0)), 0);
    divs = g.divs; if (diff < 1e-7 * Math.max(1, total)) break;
  }
  return { ...pf, divs, divTotal: divs.reduce((s, d) => s + d.amt, 0) };
}

// 최소 비용 흐름 (연속 최단 경로, 벨만-포드). 노드 수가 적어서 충분히 빠르다
function minCostFlow(nNodes, edges, s, t, need) {
  const g = Array.from({ length: nNodes }, () => []);
  const E = [];
  const add = (u, v, cap, cost) => { g[u].push(E.length); E.push({ u, v, cap, cost, flow: 0 }); g[v].push(E.length); E.push({ u: v, v: u, cap: 0, cost: -cost, flow: 0 }); };
  for (const e of edges) add(e.u, e.v, e.cap, e.cost);
  let flow = 0, cost = 0;
  for (let it = 0; it < 10000 && flow < need - EPS; it++) {
    const dist = new Array(nNodes).fill(Infinity), prev = new Array(nNodes).fill(-1); dist[s] = 0;
    for (let k = 0; k < nNodes; k++) {
      let ch = false;
      for (let i = 0; i < E.length; i++) { const e = E[i]; if (e.cap - e.flow > EPS && dist[e.u] + e.cost < dist[e.v] - 1e-12) { dist[e.v] = dist[e.u] + e.cost; prev[e.v] = i; ch = true; } }
      if (!ch) break;
    }
    if (dist[t] === Infinity) break;
    let f = need - flow; for (let v = t; v !== s; v = E[prev[v]].u) f = Math.min(f, E[prev[v]].cap - E[prev[v]].flow);
    for (let v = t; v !== s; v = E[prev[v]].u) { E[prev[v]].flow += f; E[prev[v] ^ 1].flow -= f; }
    flow += f; cost += f * dist[t];
  }
  return { flow, cost, E };
}

/* 계좌에 나눠 담기
 * accounts: [{ id, value, riskCap? (0.7 = 위험자산 70%까지) }]
 * assets:   [{ key, demand, risky, allowed: [accountId...], cost: { [accountId]: 연 세금 불리함(%p) } }]
 * current:  { [accountId]: { [key]: 지금 금액 } }

function place({ accounts, assets, current = {}, keep = 10 }) {
  const BIG = 1e6;

  const S = 0, K = 1, U = 2; const edges = []; const parts = [];

    if (!(a.value > EPS)) continue;

    if (cap != null) { parts.push({ a, node: id("A:" + a.id + ":safe"), supply: a.value * (1 - cap), safeOnly: true }); parts.push({ a, node: id("A:" + a.id + ":any"), supply: a.value * cap, safeOnly: false }); }
    else parts.push({ a, node: id("A:" + a.id), supply: a.value, safeOnly: false });
  }
  const tnode = {}; for (const as of assets) tnode[as.key] = id("T:" + as.key);
  const total = parts.reduce((s, p) => s + p.supply, 0);
  for (const p of parts) {
    edges.push({ u: S, v: p.node, cap: p.supply, cost: 0 });
    edges.push({ u: p.node, v: U, cap: Infinity, cost: BIG });
  }
  // 지금 들고 있는 금액을 위험자산 나눔(안전 칸 먼저)에 맞게 나눠 '유지' 칸 용량으로
  const curLeft = {}; for (const a of accounts) curLeft[a.id] = { ...(current[a.id] || {}) };
  const ordered = parts.slice().sort((x, y) => (y.safeOnly ? 1 : 0) - (x.safeOnly ? 1 : 0));
  const keepCap = new Map();
  for (const p of ordered) {
    let room = p.supply;
    for (const as of assets) {
      if (!as.allowed.includes(p.a.id) || (p.safeOnly && as.risky)) continue;
      const have = Math.min(curLeft[p.a.id][as.key] || 0, room); if (have <= EPS) continue;
      keepCap.set(p.node + ":" + as.key, have); curLeft[p.a.id][as.key] -= have; room -= have;
    }
  }
  for (const p of parts) for (const as of assets) {
    if (!as.allowed.includes(p.a.id) || (p.safeOnly && as.risky)) continue;
    const c = (as.cost && as.cost[p.a.id]) || 0; const kc = keepCap.get(p.node + ":" + as.key) || 0;
    if (kc > EPS) edges.push({ u: p.node, v: tnode[as.key], cap: kc, cost: c - keep });
    edges.push({ u: p.node, v: tnode[as.key], cap: Infinity, cost: c });
  }
  for (const as of assets) edges.push({ u: tnode[as.key], v: K, cap: Math.max(0, as.demand), cost: 0 });
  edges.push({ u: U, v: K, cap: Infinity, cost: 0 });
  const r = minCostFlow(nodes.length, edges, S, K, total);
  const x = {}, unplaced = {}; const nodeAcct = {}; for (const p of parts) nodeAcct[p.node] = p.a.id;
  const keyOf = {}; for (const k in tnode) keyOf[tnode[k]] = k;
  for (const e of r.E) {
    if (e.flow <= EPS || !(e.u in nodeAcct)) continue;
    const aid = nodeAcct[e.u];
    if (e.v === U) unplaced[aid] = (unplaced[aid] || 0) + e.flow;
    else if (keyOf[e.v] != null) { const k = keyOf[e.v]; (x[aid] = x[aid] || {}); x[aid][k] = (x[aid][k] || 0) + e.flow; }
  }
  const shortfall = {};
  for (const as of assets) { const got = Object.values(x).reduce((s, m) => s + (m[as.key] || 0), 0); if (as.demand - got > 1) shortfall[as.key] = as.demand - got; }
  return { x, unplaced, shortfall };
}

// 담을 곳이 없어 배분하지 못한 금액은 다른 종목에 목표 금액 비율대로 나눠 다시 담는다 (예수금으로 남기지 않음)
function placeBalanced(opts) {
  let assets = opts.assets.map(a => ({ ...a })); let r = place({ ...opts, assets }); const moved = {};
  for (let it = 0; it < 6 && Object.keys(r.shortfall).length; it++) {
    const lost = Object.values(r.shortfall).reduce((s, v) => s + v, 0);
    const ok = new Set(assets.filter(a => !r.shortfall[a.key] && a.allowed.length && a.demand > 0).map(a => a.key));
    const base = assets.filter(a => ok.has(a.key)).reduce((s, a) => s + a.demand, 0); if (!(base > 0)) break;
    assets = assets.map(a => { if (r.shortfall[a.key]) { moved[a.key] = (moved[a.key] || 0) - r.shortfall[a.key]; return { ...a, demand: a.demand - r.shortfall[a.key] }; }
      if (ok.has(a.key)) { const add = lost * a.demand / base; moved[a.key] = (moved[a.key] || 0) + add; return { ...a, demand: a.demand + add }; } return a; });
    r = place({ ...opts, assets });
  }
  return { ...r, demand: Object.fromEntries(assets.map(a => [a.key, a.demand])), moved };
}

/* 금액 → 주식 수. 계좌마다 내림한 뒤 남은 돈으로 (전체에서) 가장 모자란 종목을 한 주씩 더 산다. 나머지는 예수금
 * x: { [acct]: { [key]: 금액 } }, prices: { [key]: 원화 가격 }, cashKey: 예수금 키
 * accounts: [{ id, value, riskCap? }], risky: { [key]: bool }, demand: { [key]: 목표 금액 }
 */
function toShares({ x, accounts, prices, cashKey, risky = {}, demand = {} }) {
  const out = {}; const placed = {};
  for (const a of accounts) {

// 입력 칸에 넣는 숫자: 천 단위 쉼표 (소수점은 그대로)
const fmtIn=v=>v==null||v===""?"":isFinite(+v)?(+v).toLocaleString("ko-KR",{maximumFractionDigits:6}):esc(v);
function pct(x,d=1){if(!isFinite(x))return "–";return (x>0?"+":"")+(x*100).toFixed(d)+"%";}
function cls(x){return x>0.00005?"up":x<-0.00005?"down":"flat";}
function money(n,cur){return cur==="USD"?"$"+nf2.format(n||0):nf.format(Math.round(n||0))+"원";}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function today(){const d=new Date();const k=new Date(d.getTime()+9*3600e3);return k.toISOString().slice(0,10);}
function daysAgo(iso){if(!iso)return Infinity;const a=new Date(iso.slice(0,10)+"T00:00:00+09:00"),b=new Date(today()+"T00:00:00+09:00");return Math.round((b-a)/864e5);}
function numStr(v){return String(v??"").replace(/[,\s₩$€¥£]|원$/g,"");}
function num(v){const n=parseFloat(numStr(v));return isFinite(n)?n:0;}
// 입력칸 값이 비어 있지 않은데 숫자로 읽을 수 없으면 true
function badNum(v){const t=numStr(v);return t!==""&&!isFinite(parseFloat(t));}
function tkey(t){return String(t||"").trim().toUpperCase();}

/* ---------- computation ---------- */
const FX_MIN=500,FX_MAX=3000;   // USD/KRW로 받아들일 범위 (이 밖이면 잘못 읽은 값으로 본다)
// 환율: 받아들일 범위 밖의 값(예전 버전·다른 기기에서 잘못 들어온 값)은 없는 것으로 본다 → 환율 안내가 뜨고 기록·배분을 멈춘다
function fx(){const v=num(S.settings.usdkrw);return v>=FX_MIN&&v<=FX_MAX?v:0;}
function priceInfo(h){const p=S.prices[tkey(h.ticker)];
  if(p&&num(p.price)>0)return{price:num(p.price),asOf:p.asOf,src:p.source,missing:false,prevClose:num(p.prevClose)};
  return{price:num(h.avgPrice),missing:true};}
function rate(cur){return cur==="USD"?(fx()||0):1;}
function hVal(h){const p=priceInfo(h);return num(h.qty)*p.price*rate(h.currency);}
function hCost(h){return num(h.qty)*num(h.avgPrice)*rate(h.currency);}
// 화면을 한 번 그리는 동안(render) 같은 계산을 되풀이하지 않도록 결과를 잠깐 기억한다. 그리기가 끝나면 버린다
function memo(k,f){const m=S.memo;if(!m)return f();if(!(k in m))m[k]=f();return m[k];}
function acctHoldings(id){return memo("ah:"+id,()=>Object.values(S.holdings).filter(h=>h.accountId===id).sort((a,b)=>{const ao=a.order??1e9,bo=b.order??1e9;return ao!==bo?ao-bo:hVal(b)-hVal(a);})).slice();}
function expOf(ticker,cls,h){const a=S.assets[tkey(ticker)]||{};const as=AS();const c=cls||"기타";
  const r=has(a.expReturn)?num(a.expReturn):(h&&has(h.expReturn)?num(h.expReturn):null);const d=has(a.expDiv)?num(a.expDiv):null;
  return{r:r??num(as.returns[c]),dy:d??num(as.divYield[c]),autoR:r==null,autoD:d==null};}
/* 수익률 보정(설정): 보수·보통·낙관. 주식 기준 폭(기본 2%p)을 자산군 위험만큼 나눠 빼거나 더한다. 현금성은 그대로, 배당·분배 수익률도 그대로 */
const RET_SCEN={cons:["보수",-1],base:["보통",0],opt:["낙관",1]};
const RET_FACTOR={"주식":1,"금·원자재":1,"기타":0.75,"혼합":0.5,"채권":0.25,"현금성":0};
function retScen(k){const s=S.settings||{};k=RET_SCEN[k]?k:RET_SCEN[s.retScenario]?s.retScenario:"base";const raw=s.retShift;let w=parseFloat(raw);if(raw==null||raw===""||!(w>=0&&w<=10))w=2;return{k,name:RET_SCEN[k][0],sign:RET_SCEN[k][1],w};}
/* 주식 보정 유형: 같은 주식이라도 장기 수익률이 얼마나 불확실한지(변동성)에 맞춰 보정 폭을 다르게. S&P500 같은 시장 지수 = 1배
   배당주·배당 ETF는 변동성이 지수의 약 0.8배, 나스닥100 같은 성장·기술주는 약 1.3배, 테마·섹터 ETF와 개별 종목은 약 1.6배 이상 */
const RET_STYLE={div:["배당",0.8],index:["시장 지수",1],growth:["성장·기술",1.3],theme:["테마·섹터·개별 종목",1.6]};
const KNOWN_STYLE={SPY:"index",VOO:"index",IVV:"index",VTI:"index",VT:"index",ACWI:"index",VEA:"index",VWO:"index",EFA:"index",IWM:"index",DIA:"index",
  QQQ:"growth",QQQM:"growth",VUG:"growth",SCHG:"growth",VGT:"growth",XLK:"growth",
  SCHD:"div",VIG:"div",VYM:"div",DGRO:"div",HDV:"div",NOBL:"div",JEPI:"div",JEPQ:"div",SPYD:"div",
  SOXX:"theme",SMH:"theme",ARKK:"theme",TQQQ:"theme",SOXL:"theme",UPRO:"theme"};
function autoStyle(x){const t=tkey(x.ticker),nm=String(x.name||"");
  if(KNOWN_STYLE[t])return KNOWN_STYLE[t];
  if(/레버리지|인버스|2X|3X/i.test(nm))return "theme";
  if(/배당|dividend|리츠|REIT|커버드콜|인컴|income/i.test(nm))return "div";
  if(/반도체|HBM|2차전지|배터리|\bAI\b|인공지능|로봇|바이오|헬스케어|에너지|방산|조선|원자력|원전|게임|클라우드|사이버|우주|양자|메타버스/i.test(nm))return "theme";
  if(/나스닥|NASDAQ|테크|tech|빅테크|성장|growth|혁신/i.test(nm))return "growth";
  if(ETF_RE.test(nm)||/\bETF\b|TRUST|FUND/i.test(nm))return "index";
  return "theme";} // ETF가 아니면 개별 종목
function styleOf(x){const a=S.assets[tkey(x.ticker)]||{};const st=a.retStyle||x.retStyle;return RET_STYLE[st]?st:autoStyle({...x,name:a.name||x.name});}
function retAdj(c,k,st){const sc=retScen(k);const f=RET_FACTOR[c||"기타"]??0.75;const g=(c==="주식"||c==="혼합")?RET_STYLE[RET_STYLE[st]?st:"index"][1]:1;return sc.sign*sc.w*f*g;}
function holdAdj(h,k){return retAdj(h.assetClass||"기타",k,styleOf(h));}
function scenLabel(){const sc=retScen();return sc.sign?`${sc.name} (주식 ${sc.sign<0?"−":"+"}${sc.w}%p)`:"보통";}
function expTxt(r){return `${(Math.round(r*100)/100).toLocaleString("ko-KR")}%`;}
function adjTxt(v){const x=Math.round(v*100)/100;return x?`${x<0?"−":"+"}${Math.abs(x).toLocaleString("ko-KR")}%p`:"0%p";}
// 계좌 예상 연수익률(%): 보유 종목 예상 수익률을 평가액으로 가중평균(계좌 계획에서 직접 넣었으면 그 값) + 수익률 보정. 예수금·생활비 현금은 ‘현금성’
function acctExp(a,k){const as=AS();const st=acctStats(a);let rv=0,dv=0,av=0,tv=0;
  st.hs.forEach(h=>{const v=hVal(h);const e=expOf(h.ticker,h.assetClass,h);rv+=v*e.r;dv+=v*e.dy;av+=v*holdAdj(h,k);tv+=v;});
  rv+=st.cash*num(as.returns["현금성"]);dv+=st.cash*num(as.divYield["현금성"]);tv+=st.cash;
  const dc=a.type==="생활비"?"현금성":"혼합";
  const ap=(PL().accountPlans||{})[a.id]||{};const ov=has(ap.returnOverride)?num(ap.returnOverride):null;
  const auto=tv>0?rv/tv:num(as.returns[dc]);const adj=tv>0?av/tv:retAdj(dc,k);const dyAuto=tv>0?dv/tv:num(as.divYield[dc]);
  return{auto,adj,dyAuto,base:ov??auto,r:(ov??auto)+adj,dy:has(ap.divOverride)?num(ap.divOverride):dyAuto,override:ov!=null,value:st.total};}
// 여러 계좌를 평가액으로 가중평균 (구성원·가족 전체)
function groupExp(accts,k){let v=0,rv=0,dv=0;accts.forEach(a=>{const e=acctExp(a,k);v+=e.value;rv+=e.value*e.r;dv+=e.value*e.dy;});return v>0?{r:rv/v,dy:dv/v,value:v}:null;}
function memberAccts(mid){return acctList().filter(a=>mid==="__all"||(mid==="__none"?!ownerOf(a):ownerOf(a)===mid));}
function memberExp(mid,k){return groupExp(memberAccts(mid),k);}
function acctStats(a){return {...memo("st:"+a.id+":"+num(a.cash),()=>{const hs=acctHoldings(a.id);let v=0,c=0,risky=0;
  hs.forEach(h=>{const x=hVal(h);v+=x;c+=hCost(h);if(h.risky)risky+=x;});
  const cash=num(a.cash);return{hs,value:v,cost:c,cash,total:v+cash,risky,riskRatio:(v+cash)>0?risky/(v+cash):0};})};}
function acctList(){return memo("acl",()=>Object.values(S.accounts).sort((a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(b.name))).slice();}
function totals(){let total=0,cost=0,cash=0;const byClass={};const byAcct=[];
  acctList().forEach(a=>{const st=acctStats(a);total+=st.total;cost+=st.cost;cash+=st.cash;byAcct.push({a,st});
    st.hs.forEach(h=>{const k=h.assetClass||"기타";byClass[k]=(byClass[k]||0)+hVal(h);});});
  if(cash)byClass["현금성"]=(byClass["현금성"]||0)+cash;
  return{total,cost,cash,invested:total-cash,byClass,byAcct};}
// 기간 손익(주간·월간·연간): 지금 평가손익 − 기간 시작일(그날이나 그 전 가장 가까운 기록)의 평가손익.
// 기간 중에 넣거나 뺀 돈은 원금(매입 금액 + 현금)이 함께 바뀌어 손익에 들어가지 않는다. 비율은 시작일 투자 평가액(현금 제외) 대비
// 한 달·한 해 전: 그 달에 같은 날이 없으면(3월 31일 → 2월) 그 달 마지막 날
function backMonths(d,n){const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()-n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));}
const PERIODS=[["주간",d=>{d.setUTCDate(d.getUTCDate()-7);},3],["월간",d=>backMonths(d,1),7],["연간",d=>backMonths(d,12),31]];
function periodPL(back,tol){const t=totals();const d=new Date(today()+"T00:00:00Z");back(d);const from=d.toISOString().slice(0,10);
  const d2=new Date(d.getTime()-tol*864e5).toISOString().slice(0,10);
  const base=(S.snapshots||[]).filter(x=>x&&x.date&&x.date<=from&&x.date>=d2&&x.total>0&&x.cost>0).pop();
  if(!base)return null;
  // 그사이 기록마다 넣거나 뺀 돈(기록에 있으면 그 값, 없으면 원금 변화)을 빼고 더한 손익. 마지막은 지금 장부
  const pts=retPts("__all",false).filter(x=>x.date>=base.date&&x.date<today()).concat([{date:today(),total:t.total,cost:t.cost+t.cash}]);
  let v=0;retSteps(pts,(a,b,F)=>{v+=b.total-a.total-F;});
  const inv=base.total-(+base.cash||0);return{d:v,r:inv>0?v/inv:null,date:base.date,from};}
function periodChips(){if(!(S.snapshots||[]).length)return "";
  const xs=PERIODS.map(([l,b,tol])=>[l,periodPL(b,tol)]).filter(([,x])=>x);   // 그만큼 오래된 기록이 있는 기간만
  if(!xs.length)return "";
  return `<div class="chips pchips">${xs.map(([l,x])=>`<span class="chip" data-period="${l}" title="${esc(x.date)} 기록 대비 평가손익 변화 · 그사이 넣거나 뺀 돈은 빼고, 비율은 그때 투자 평가액(현금 제외) 대비">${l} <b class="${cls(x.d)}">${fmtM(x.d,{plus:true})}</b>${x.r==null?"":` <span class="${cls(x.d)}">${pct(x.r,2)}</span>`}</span>`).join("")}</div>`;}
// 기록으로 본 실제 수익률(시간가중): 기록과 기록 사이마다 넣거나 뺀 돈을 빼고 수익률을 구해 곱한다
// (수정 디에츠: 그 돈은 두 기록 사이 중간에 들어왔다고 본다). pts: 날짜순 [{date,total,cost,flow?}] (cost = 원금, 현금 포함).
// 넣거나 뺀 돈: 기록에 flow(앞 기록 뒤로 그 기록까지 들어온 돈, 빼면 −)가 있으면 그 값, 없으면 원금 변화로 대신한다
// (원금 변화에는 팔아서 생긴 차익도 들어가 그만큼 수익이 빠진다). 평가액·원금을 모르는 기록은 건너뛰고, 그날 flow는 다음 기록에 넘긴다.
// 1년 이상이면 연평균(ann)으로 환산하고, 그보다 짧으면 환산하지 않는다(짧은 기간을 연으로 늘리면 숫자가 크게 부풀기 때문)
function retSteps(pts,fn){let a=null,carry=0;
  for(const b of pts||[]){if(!b||!b.date)continue;
    if(!(b.total>0&&b.cost>0)){if(a&&b.flow!=null)carry+=+b.flow||0;continue;}
    if(a)fn(a,b,b.flow!=null?(+b.flow||0)+carry:b.cost-a.cost);
    carry=0;a=b;}}
function twr(pts){let g=1,n=0,from=null,to=null;
  retSteps(pts,(a,b,F)=>{if(!n){from=a.date;n=1;}n++;to=b.date;const den=a.total+F/2;if(den>0)g*=1+(b.total-a.total-F)/den;});
  if(n<2)return null;const days=Math.round((Date.parse(to+"T00:00:00Z")-Date.parse(from+"T00:00:00Z"))/864e5);if(!(days>0)||!(g>0))return null;
  return{r:g-1,days,from,to,n,ann:days>=365?Math.pow(g,365/days)-1:null};}
// 예상 연수익률 e(%)를 days일 동안의 수익률로
function expOver(e,days){return Math.pow(1+e/100,days/365)-1;}
// 수익률 비교에 쓸 기록: k = "__all"(가족 전체) 또는 구성원 id. live면 오늘 값(지금 장부)을 마지막 기록으로 쓴다
// 기록마다 넣거나 뺀 돈: 가족 전체는 flow, 구성원은 byMemberFlow (복원한 기록 등에만 있다). 평가액이 0인 기록도 넘겨 그날 flow를 잇는다
function retPts(k,live){const all=(S.snapshots||[]).filter(x=>x&&x.date);
  let pts=k==="__all"?all.map(x=>({date:x.date,total:x.total,cost:x.cost,flow:x.flow})):all.map(x=>({date:x.date,total:(x.byMember&&x.byMemberCost&&x.byMember[k])||0,cost:(x.byMember&&x.byMemberCost&&x.byMemberCost[k])||0,flow:x.byMemberFlow?(+x.byMemberFlow[k]||0):undefined}));
  if(live&&!needsFx()){const d=memo("snapNow",()=>snapDoc(false));const v=k==="__all"?{total:d.total,cost:d.cost,flow:d.flow}:{total:(d.byMember||{})[k],cost:(d.byMemberCost||{})[k],flow:d.byMemberFlow?(+d.byMemberFlow[k]||0):undefined};
    if(v.total>0&&v.cost>0)pts=pts.filter(x=>x.date<d.date).concat([{date:d.date,total:v.total,cost:v.cost,flow:v.flow}]);}
  return pts;}
const mdTxt=d=>d.slice(5).replace("-","/");
// 실제 수익률과 예상 수익률을 나란히: 1년 이상 기록이면 연평균끼리, 짧으면 같은 기간끼리. e = 예상 {r, dy}
function retCmpHtml(w,e,opt){opt=opt||{};const sc=opt.scen?` · ${esc(opt.scen)}`:"";
  if(!w)return e?`<div class="kv kv2 retcmp"><div><span>실제 수익률</span><b class="flat">–</b><small>평가액 기록이 2개 이상이면 나옵니다</small></div><div><span>예상 연수익률</span><b>${expTxt(e.r)}</b><small>배당·분배 ${expTxt(e.dy)}${sc}</small></div></div>`:"";
  const rng=`${mdTxt(w.from)}~${mdTxt(w.to)}`;
  if(w.ann!=null)return `<div class="kv kv2 retcmp"><div><span>실제 연평균 수익률</span><b class="${cls(w.ann)}">${pct(w.ann,2)}</b><small>기록 ${w.from}~${w.to} (${nf.format(w.days)}일)</small></div>${e?`<div><span>예상 연수익률</span><b>${expTxt(e.r)}</b><small>배당·분배 ${expTxt(e.dy)}${sc}</small></div>`:""}</div>`;
  const x=e?expOver(e.r,w.days):null;
  return `<div class="kv kv2 retcmp"><div><span>실제 수익률 · ${nf.format(w.days)}일</span><b class="${cls(w.r)}">${pct(w.r,2)}</b><small>기록 ${rng}</small></div>${e?`<div><span>같은 기간 예상</span><b class="${cls(x)}">${pct(x,2)}</b><small>연 ${expTxt(e.r)}${sc}</small></div>`:""}</div>`;}
// 구성원 줄처럼 좁은 곳: 한 줄 문구
function retCmpTxt(w,e){if(!w)return e?`예상 수익률 연 ${expTxt(e.r)}`:"";
  if(w.ann!=null)return `실제 연평균 <b class="${cls(w.ann)}">${pct(w.ann,1)}</b>${e?` · 예상 연 ${expTxt(e.r)}`:""}`;
  const x=e?expOver(e.r,w.days):null;return `${nf.format(w.days)}일 실제 <b class="${cls(w.r)}">${pct(w.r,2)}</b>${e?` · 예상 <span class="${cls(x)}">${pct(x,2)}</span> (연 ${expTxt(e.r)})`:""}`;}
const RET_NOTE="실제 수익률은 평가액 기록으로 구하고, 그사이 넣거나 뺀 돈은 빼고 계산합니다. 넣거나 뺀 돈은 따로 적지 않아도 앞 기록의 보유 종목을 지금 가격으로 다시 평가해 자동으로 구합니다(사고판 차익은 수익, 배당·분배금은 예상 배당률만큼 수익으로 봄). 보유 종목이 남지 않은 예전 기록 사이는 바뀐 원금으로 대신합니다. 기록이 1년이 안 되면 연평균으로 늘리지 않고 같은 기간끼리 비교합니다.";

/* ---------- db ---------- */
function hydrate(){const o={};for(const id in S.holdingsRaw){const h=S.holdingsRaw[id];const a=S.assets[tkey(h.ticker)]||{};
  o[id]={...h,name:a.name||h.name,currency:a.currency||h.currency,assetClass:a.assetClass||h.assetClass,note:h.note||(a.name&&h.name&&h.name!==a.name?h.name:"")};}S.holdings=o;}
async function initDb(){
  let db=null;try{db=window.claude&&await window.claude.use("db");}catch(e){db=null;}
  if(!db){S.dbState="none";render();return;}
  S.dbRaw=db;S.db=hookDb(db);S.dbState="ok";
  const onErr=e=>{if(e&&e.code==="revoked"){S.dbState="none";render();}};
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]={...d.data(),id:d.id};});applyOrdPend(col,o);S[key]=o;S.loaded[key]=true;if(key==="holdingsRaw"||key==="assets")hydrate();render();},onErr);
  S.loaded={};
  sub("accounts","accounts");sub("holdings","holdingsRaw");sub("prices","prices");sub("assets","assets");
  db.doc("settings/main").onSnapshot(d=>{const v=d.exists?{...d.data()}:{};S.settingsServer=v;
    if(S.setPend>0&&docHash(v)!==S.setLastHash)return;   // 저장 중에 도착한 앞선 저장의 메아리: 무시 (마지막 저장 내용과 같은 것만 받는다)
    S.settings=v;S.loaded.settings=true;render();},onErr);
  db.doc("plan/main").onSnapshot(d=>{const v=d.exists?JSON.parse(JSON.stringify(d.data())):null;S.planServer=v;S.planServerExists=!!d.exists;
    if(S.planPend>0&&(v?docHash(v):"")!==S.planLastHash)return;
    S.plan=v?JSON.parse(JSON.stringify(v)):null;if(S.plan)PL();S.planExists=!!d.exists;S.planLoaded=true;S.simCache.key=null;render();},onErr);
  db.collection("snapshots").orderBy("date","desc").limit(1000).onSnapshot(snap=>{S.snapshots=snap.docs.map(d=>d.data()).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const first=!S.loaded.snapshots;S.loaded.snapshots=true;if(first||S.tab==="home"||S.tab==="trend")render();},onErr);   // 기록을 보여 주는 화면일 때만 다시 그린다
  db.doc("sync/base").onSnapshot(d=>{const v=d.exists?d.data():null;S.syncBase=v&&v.h?{...v,h:KSync.unpackBase(v.h)}:v;render();},onErr);
}
// 수정 시각을 뺀 내용 비교용
function docHash(v){if(!v)return "";const {updatedAt:_u,...r}=v;return KSync.hash(r);}
// 목록 순서 바꾸기: 저장이 끝날 때까지 이 기기에서 정한 순서를 지킨다
S.ordPend={accounts:{},holdings:{},assets:{}};
function applyOrdPend(col,o){const pend=S.ordPend[col];if(!pend)return;for(const id in pend){const d=o[id];if(!d){delete pend[id];continue;}if(d.order===pend[id])delete pend[id];else o[id]={...d,order:pend[id]};}}
// 설정 문서는 한 번에 하나씩 순서대로 쓴다. 실패하면 화면을 저장소 내용으로 되돌린다
S.setPend=0;S.setLastHash="";let setQ=Promise.resolve();
function writeSettings(obj,msg){S.settings=obj;S.setPend++;S.setLastHash=docHash(obj);const snap={...obj,updatedAt:new Date().toISOString()};
  const q=setQ.then(async()=>{const ok=await write(db=>db.doc("settings/main").set(snap),msg);S.setPend--;
    if(!ok&&!S.setPend&&S.settingsServer){S.settings={...S.settingsServer};S.simCache.key=null;render();toast("설정을 저장하지 못해 되돌렸습니다. 다시 시도하세요",5000);}return ok;});
  setQ=q.catch(()=>{});return q;}
async function write(fn,okMsg){if(!S.db){toast("저장소에 연결되지 않았습니다");return false;}
  try{await fn(S.db);if(okMsg)toast(okMsg);return true;}
  catch(e){const c=e&&e.code;
    if(c==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await fn(S.db);if(okMsg)toast(okMsg);return true;}catch(e2){}}
    toast(c==="quota_exceeded"?"저장 공간이 가득 찼습니다":"저장하지 못했습니다. 잠시 후 다시 시도하세요");return false;}}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// 저장되면(값이 같아지면) 버린다. 곧바로 저장되는 칸은 바꾸기(change) 때 버리고, 버튼으로 저장하는 양식(가정·환율 등)은 그 버튼에서 버린다

const DRAFT_BTN=/^#(as|sFx|sGcid)/;
function inKey(e){if(!e||!e.matches||!e.matches("input,textarea,select")||/^(checkbox|radio|file|button|submit)$/.test(e.type))return null;
  if(e.id)return "#"+CSS.escape(e.id);for(const a of e.attributes)if(a.name.startsWith("data-"))return `[${a.name}="${CSS.escape(a.value)}"]`;return null;}
function clearDraft(prefix){for(const k in S.draft)if(k.startsWith(prefix))delete S.draft[k];}
function restoreDrafts(actKey,sel){
  for(const k in S.draft){const el=app.querySelector(k);if(!el)continue;if(el.value===S.draft[k]){delete S.draft[k];continue;}el.value=S.draft[k];}
  if(actKey){const el=app.querySelector(actKey);if(el&&document.activeElement!==el){try{el.focus({preventScroll:true});if(sel)el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}

function sparkline(points){if(points.length<2)return "";
  const W=320,H=64,P=4;const vs=points.map(p=>p.total);const mn=Math.min(...vs),mx=Math.max(...vs);const rg=mx-mn||1;
  const xy=points.map((p,i)=>[P+(W-2*P)*i/(points.length-1),H-P-(H-2*P)*(p.total-mn)/rg]);
  const d=xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const last=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="평가액 추이">
   <path d="${d} L${last[0].toFixed(1)} ${H} L${P} ${H} Z" fill="var(--accent-soft)" stroke="none"/>
   <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
   <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/></svg>`;}

// 가격 날짜: 지금 보유한 종목의 가격 중 가장 오래된 날과 가장 최근 날 (보유가 없으면 모든 가격). 같은 날이면 한 날짜
function priceDates(){const held=new Set(Object.values(S.holdings).filter(h=>num(h.qty)>0).map(h=>tkey(h.ticker)));
  let ps=Object.entries(S.prices).filter(([k,p])=>p&&p.asOf&&held.has(k)).map(([,p])=>p.asOf);if(!ps.length)ps=Object.values(S.prices).filter(p=>p&&p.asOf).map(p=>p.asOf);
  if(!ps.length)return null;ps.sort();return{old:ps[0],now:ps[ps.length-1]};}
function freshness(){const d=priceDates();return d?d.now:null;}
function priceDateTxt(){const d=priceDates();if(!d)return "";return d.old===d.now?d.now:`${d.old}~${d.now.slice(d.old.slice(0,4)===d.now.slice(0,4)?5:0)}`;}

function consolidate(mid){
  const accts=acctList().filter(a=>mid==="__all"||(mid==="__none"?!ownerOf(a):ownerOf(a)===mid));
  const m={};let cash=0,total=0;
  accts.forEach(a=>{const st=acctStats(a);cash+=st.cash;total+=st.total;
    st.hs.forEach(h=>{const k=tkey(h.ticker);const v=hVal(h),c=hCost(h),q=num(h.qty);
      const x=m[k]||(m[k]={ticker:k,name:h.name,currency:h.currency,assetClass:h.assetClass||"기타",qty:0,value:0,cost:0,costNative:0,accts:[]});
      x.qty+=q;x.value+=v;x.cost+=c;x.costNative+=q*num(h.avgPrice);

function watchList(){const {m,seen}=heldInfo();const w={};

  const sheetT=(S.settings||{}).gSheetTickers||[];const notIn=wl.filter(w=>!sheetT.includes(tkey(w.ticker))&&!bySym[gfSymbol(w)]&&!rows.some(x=>x[0]===gfSymbol(w)));
  return {n,changed:writes.length,fx:fx2,fxBad,fxOld:fx0,miss,curBad,noDate,big,notIn:notIn.map(w=>w.name||w.ticker)};}
async function gdBackup(){const f=await gdCreate({title:`Kinfolio 백업 ${today()} ${new Date(Date.now()+9*3600e3).toISOString().slice(11,16).replace(":","-")}.json`,contentMimeType:"application/json",disableConversionToGoogleType:true,textContent:JSON.stringify(await exportDocFull())});
  if(!f||!f.id)throw{code:"tool_error",message:"백업 파일을 만들지 못했습니다"};saveRet({gLastBackup:new Date().toISOString()});return f;}
/* 주 단위 자동 백업: 구글 드라이브 Kinfolio/backup/<연도>/‘Kinfolio 백업 2026-W40 (09-28~10-04).json’.
   주는 월요일~일요일(한국 시간, ISO 주 번호). 그 주 파일이 이미 있으면(이 기기든 다른 기기든) 다시 만들지 않는다 */
function isoWeek(date){const d=new Date(date+"T00:00:00Z");const dow=(d.getUTCDay()+6)%7;   // 월=0
  const thu=new Date(d.getTime()+(3-dow)*864e5);const y=thu.getUTCFullYear();const w=Math.floor((thu-Date.UTC(y,0,1))/864e5/7)+1;
  const mon=new Date(d.getTime()-dow*864e5).toISOString().slice(0,10),sun=new Date(d.getTime()+(6-dow)*864e5).toISOString().slice(0,10);
  return{year:y,week:w,key:`${y}-W${String(w).padStart(2,"0")}`,from:mon,to:sun};}
function weekTitle(wk){return `Kinfolio 백업 ${wk.key} (${wk.from.slice(5)}~${wk.to.slice(5)}).json`;}
const GD_FOLDER="application/vnd.google-apps.folder";
async function gdFindIn(parent,name){const r=await gdCall("search_files",{query:`parentId = '${parent}' and title = '${name}' and mimeType = '${GD_FOLDER}'`,excludeContentSnippets:true,pageSize:10});
  const fs=((r&&r.files)||[]).filter(f=>f.title===name).sort((a,b)=>String(a.createdTime||"").localeCompare(String(b.createdTime||"")));return fs[0]?fs[0].id:null;}   // 여러 개면 먼저 만든 것
async function gdSubFolder(parent,name){const id=await gdFindIn(parent,name);if(id)return id;
  const f=await gdCall("create_file",{title:name,contentMimeType:GD_FOLDER,parentId:parent});if(!f||!f.id)throw{code:"tool_error",message:`‘${name}’ 폴더를 만들지 못했습니다`};return f.id;}
async function gdWeekBackup(){const wk=isoWeek(today());const title=weekTitle(wk);
  const go=async()=>{const root=await gdFolder();const bk=await gdSubFolder(root,"backup");const yf=await gdSubFolder(bk,String(wk.year));
    const r=await gdCall("search_files",{query:`parentId = '${yf}' and title contains '${wk.key}'`,excludeContentSnippets:true,pageSize:10});
    const had=((r&&r.files)||[]).find(f=>String(f.title||"").includes(wk.key));
    if(had)return{skipped:true,title:had.title,year:wk.year,key:wk.key};
    const f=await gdCall("create_file",{title,contentMimeType:"application/json",disableConversionToGoogleType:true,textContent:JSON.stringify(await exportDocFull()),parentId:yf});
    if(!f||!f.id)throw{code:"tool_error",message:"백업 파일을 만들지 못했습니다"};return{title,year:wk.year,key:wk.key,id:f.id};};
  let res;try{res=await go();}catch(e){if(e&&e.code==="tool_error"&&(S.settings||{}).gFolderId){await saveRet({gFolderId:null});res=await go();}else throw e;}   // Kinfolio 폴더가 지워졌으면 새로 만들어 한 번 더
  await saveRet({gWeekBackup:res.key,...(res.skipped?{}:{gLastBackup:new Date().toISOString()})});return res;}
function bkAuto(){return (S.settings||{}).bkAuto!==false;}
let bkT=null;
async function bkAutoRun(){clearTimeout(bkT);bkT=null;const s=S.settings||{};
  if(!bkAuto()||!S.gdAvail||S.dbState!=="ok"||!acctList().length||document.visibilityState==="hidden")return false;
  if(s.gWeekBackup===isoWeek(today()).key||Date.now()-(S.bkFail||0)<30*60e3)return false;   // 이번 주는 이미 했거나, 실패하고 30분이 안 됨
  if(PWA&&!KinfolioPWA.hasToken())return false;
  if(!snapReady()||S.gdBusy){bkT=setTimeout(bkAutoRun,5000);return false;}   // 데이터를 다 받고, 동기화·다른 드라이브 작업이 끝난 뒤에
  return gdRun("weekly",{auto:true});}

// 불러올 백업: Kinfolio 폴더(직접 백업)와 backup/<연도> 폴더(주 단위 자동 백업), 최근 순 30개
async function gdBackupsIn(fid){if(!fid)return [];
  const q=p=>gdCall("search_files",{query:`parentId = '${p}' and mimeType = 'application/json' and title contains 'Kinfolio 백업'`,excludeContentSnippets:true,pageSize:30}).then(r=>(r&&r.files)||[]);
  let out=await q(fid);
  const bk=await gdFindIn(fid,"backup");
  if(bk){const r=await gdCall("search_files",{query:`parentId = '${bk}' and mimeType = '${GD_FOLDER}'`,excludeContentSnippets:true,pageSize:50});
    const ys=((r&&r.files)||[]).filter(f=>/^\d{4}$/.test(f.title||"")).sort((a,b)=>String(b.title).localeCompare(String(a.title))).slice(0,2);   // 최근 두 해
    for(const y of ys)out=out.concat((await q(y.id)).map(f=>({...f,where:`backup/${y.title}`})));}
  return out.sort((a,b)=>String(b.createdTime).localeCompare(String(a.createdTime))).slice(0,30);}
function gdPriceMsg(r){return `가격 ${r.n}개${r.changed!=null&&r.changed<r.n?`(바뀐 것 ${r.changed}개)`:""}${r.fx?` · 환율 ${nf2.format(r.fx)}`:""}를 가져왔습니다.${r.miss.length?` 가격이 나오지 않은 종목: ${r.miss.join(", ")} (시트에서 종목 코드를 확인하세요).`:""}${(r.curBad||[]).length?` 통화가 달라 저장하지 않은 종목: ${r.curBad.join(", ")} (다른 거래소 가격일 수 있습니다. 종목 코드를 확인하세요).`:""}${r.fxBad?` 시트의 환율 ${nf2.format(r.fxBad)}이 ${r.fxOld?`지금 값 ${nf2.format(r.fxOld)}과 너무 달라`:"있을 수 없는 값이라"} 저장하지 않았습니다. 설정에서 직접 넣으세요.`:""}${(r.big||[]).length?` 전보다 30% 넘게 바뀐 종목: ${r.big.join(", ")} (분할·병합이 아니면 확인하세요).`:""}${(r.noDate||[]).length?` 기준 시각이 없어 오늘 날짜로 적은 종목: ${r.noDate.join(", ")}.`:""}${r.notIn.length?` 시트에 없는 종목: ${r.notIn.join(", ")} → ‘시트 다시 만들기’를 누르세요.`:""}`;}
async function gdRun(kind,o){o=o||{};if(S.gdBusy)return false;S.gdBusy=kind;if(!o.auto)gdSet(kind,null);else render();const t0=performance.now();
  if(o.auto&&PWA)KinfolioPWA.quiet=true;   // 자동 업데이트는 로그인 창을 띄우지 않는다

    else if(kind==="restore"){const list=await gdBackups();if(!list.length){gdSet(kind,"드라이브의 Kinfolio 폴더에 백업이 없습니다.",true);}else{S.gdBusy=null;render();gdPickSheet(list);return;}}
  }catch(e){if(kind==="weekly"){gdSet("backup",(o.auto?"주 단위 자동 백업 실패: ":"")+gdErrText(e),true);if(o.auto)S.bkFail=Date.now();return false;}

/* 가격 자동 업데이트: 시세 시트가 있으면 앱을 열 때, 다시 볼 때, 켜 둔 동안 30분마다 가져온다.

/* ---------- 기기 간 동기화: 구글 드라이브 ‘Kinfolio 데이터.json’ ----------
   아티팩트(claude.ai 커넥터)와 PC·안드로이드 앱(PWA, 드라이브 API)이 같은 파일로 데이터를 맞춘다. 병합 규칙은 sync.js */
const SYNC_NAME="Kinfolio 데이터.json";

function syncDirty(){if(syncOn())syncSchedule(PWA?4000:10000);}
// 사용자가 고친 문서에는 수정 시각을 찍고(동기화가 어느 쪽이 나중인지 알도록), 고친 뒤 자동 동기화를 예약한다.
// 동기화 자신이 쓰는 것은 S.dbRaw로 바로 쓴다
function hookDb(db){const own=p=>String(p).startsWith("sync/");
